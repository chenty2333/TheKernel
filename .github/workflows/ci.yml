name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  THEKERNEL_AX_REPOSITORY: https://github.com/chenty2333/thekernel-ax.git
  THEKERNEL_LINUX_ABI_REPOSITORY: https://github.com/chenty2333/thekernel-linux-abi.git
  VISA_REPOSITORY: https://github.com/chenty2333/vISA.git

jobs:
  per-commit:
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.THEKERNEL_DEV_IMAGE || format('ghcr.io/{0}/thekernel-dev:nightly', github.repository_owner) }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Trust checkout in job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Provision maintained siblings from main
        run: |
          ax_ref=$(git ls-remote "$THEKERNEL_AX_REPOSITORY" refs/heads/main | awk 'NR == 1 { print $1 }')
          linux_abi_ref=$(git ls-remote "$THEKERNEL_LINUX_ABI_REPOSITORY" refs/heads/main | awk 'NR == 1 { print $1 }')
          THEKERNEL_AX_REF="$ax_ref" \
            THEKERNEL_LINUX_ABI_REF="$linux_abi_ref" \
            ./scripts/ci/provision-maintained-siblings.sh
          printf 'THEKERNEL_AX_REF=%s\n' "$ax_ref" >>"$GITHUB_ENV"
          printf 'THEKERNEL_LINUX_ABI_REF=%s\n' "$linux_abi_ref" >>"$GITHUB_ENV"

      - name: Provision vISA sibling from main
        run: |
          git clone --depth=1 --single-branch --branch main \
            "$VISA_REPOSITORY" "$GITHUB_WORKSPACE/../vISA"

      - name: Per-commit gate
        id: gate
        run: ./scripts/ci/per-commit.sh

      - name: Upload gate logs
        if: ${{ always() && steps.gate.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: per-commit-logs
          path: .state/ci/per-commit/
          include-hidden-files: true

  # A Docker job container starts with its own seccomp filter and therefore
  # cannot provide a mode-0 Linux differential baseline. Keep this job on the
  # bare hosted runner; the containerized per-commit gate records an explicit
  # compile-only skip instead of treating inherited policy as runtime evidence.
  host-seccomp-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run host Linux seccomp differential
        run: ./scripts/ci/seccomp-host-differential.sh

      - name: Upload seccomp differential log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: host-seccomp-differential
          path: .state/ci/seccomp-host-differential/
          include-hidden-files: true

  # Run the AF_PACKET Linux oracle on a bare runner as well. The gate creates
  # a fresh user and network namespace for every run and treats missing
  # namespace/CAP_NET_RAW support as failure rather than a compatibility skip.
  host-packet-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Ubuntu 24.04 enables AppArmor mediation for unprivileged user
      # namespaces. This dedicated ephemeral job needs a fresh user+network
      # namespace so CAP_NET_RAW is scoped to the oracle instead of the host.
      # Provision that prerequisite explicitly; the differential script still
      # treats any namespace, capability, or Linux behavior failure as fatal.
      - name: Enable isolated unprivileged user namespaces
        run: |
          restriction=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [[ -e "$restriction" && "$(<"$restriction")" != 0 ]]; then
            printf '0\n' | sudo tee "$restriction" >/dev/null
          fi
          [[ ! -e "$restriction" || "$(<"$restriction")" == 0 ]]

      - name: Run host Linux packet differential
        run: ./scripts/ci/packet-host-differential.sh

      - name: Upload packet differential evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: host-packet-differential
          path: .state/ci/packet-host-differential/
          include-hidden-files: true

  # These portable cases need no elevated host capability. Run each against
  # the bare hosted Linux kernel and retain the working-tree source hashes in
  # the receipt so a local dirty checkout cannot accidentally claim a stale
  # committed input.
  host-portable-differentials:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        case:
          - futex
          - futex2-waitv-signal
          - epoll
          - signal-order
          - vfork
          - signal-mask-alias
          - io-uring-directio
          - proc-zombie
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run host Linux ${{ matrix.case }} differential
        run: ./scripts/ci/${{ matrix.case }}-host-differential.sh

      - name: Validate host differential receipt
        run: >-
          python3 scripts/ci/differential/validate-receipt.py
          --receipt .state/ci/${{ matrix.case }}-host-differential/receipt.json
          --case ${{ matrix.case }}
          --manifest scripts/ci/differential/manifests/${{ matrix.case }}.markers
          --require-empty-allowlist --require-pass

      - name: Upload ${{ matrix.case }} differential evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: host-${{ matrix.case }}-differential
          path: .state/ci/${{ matrix.case }}-host-differential/
          include-hidden-files: true

  # Full x86_64 boot remains on the self-hosted QEMU runner. Root images are
  # built from this repository by the gate itself.
  x86_64-pr:
    if: >-
      ${{ vars.THEKERNEL_QEMU_CI == '1' &&
          (github.event_name == 'pull_request' || github.event_name == 'push' ||
           github.event_name == 'workflow_dispatch') }}
    runs-on:
      - self-hosted
      - linux
      - thekernel-qemu
    container:
      image: ${{ vars.THEKERNEL_DEV_IMAGE || format('ghcr.io/{0}/thekernel-dev:nightly', github.repository_owner) }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Trust checkout in job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Provision pinned maintained siblings
        run: ./scripts/ci/provision-maintained-siblings.sh

      - name: x86_64 release and boot gate
        id: gate
        run: ./scripts/ci/pr-gate.sh --log-dir "$RUNNER_TEMP/thekernel-pr-gate"

      - name: Upload PR gate logs
        if: ${{ always() && steps.gate.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: x86_64-pr-logs
          # The gate seals kernels, rootfs images, receipts, consoles, and all
          # step logs into this external, self-contained evidence directory.
          path: ${{ runner.temp }}/thekernel-pr-gate/
          include-hidden-files: true
