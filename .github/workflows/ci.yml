name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: thekernel-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  host:
    name: Host checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ${{ vars.THEKERNEL_DEV_IMAGE || format('ghcr.io/{0}/thekernel-dev:nightly', github.repository_owner) }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: TheKernel
    env:
      CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      THEKERNEL_CI_TARGET_DIR: ${{ github.workspace }}/TheKernel/.state/ci/cargo-target
    steps:
      - name: Checkout TheKernel
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: TheKernel
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pinned vISA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: chenty2333/vISA
          ref: 198b1bdf7641717f52cd386752f0f25974db6d11
          path: vISA
          persist-credentials: false

      - name: Checkout pinned mechanism workspace
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: chenty2333/thekernel-ax
          ref: a9a89b0545e8af88213b39fb0ba050dbfeafc0b3
          path: thekernel-ax
          persist-credentials: false

      - name: Checkout pinned Linux ABI workspace
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: chenty2333/thekernel-linux-abi
          ref: 92ca5300541740037974a932615d1985aa218f9b
          path: thekernel-linux-abi
          persist-credentials: false

      - name: Cache Cargo outputs
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: TheKernel -> .state/ci/cargo-target

      - name: Trust mounted checkouts
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/TheKernel"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/vISA"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/thekernel-ax"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/thekernel-linux-abi"

      - name: Check changed-line whitespace
        run: |
          set -euo pipefail
          if [[ -n "${CI_DIFF_BASE:-}" ]] \
              && git cat-file -e "${CI_DIFF_BASE}^{commit}" 2>/dev/null; then
            git diff --check "$CI_DIFF_BASE" HEAD --
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD --
          fi
          git diff --check
          git diff --cached --check

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Validate vendored provenance
        run: |
          python3 scripts/ci/validate_vendor_provenance.py \
            --archive-policy if-present \
            --ax-repo ../thekernel-ax \
            --linux-abi-repo ../thekernel-linux-abi

      - name: Test build and runner tools
        run: make test-tools

      - name: Test local adapters
        run: |
          cargo test --locked -p thekernel-readiness-adapter
          cargo test --locked -p thekernel-linux-process-adapter

      - name: Check host kernel profile
        run: |
          env \
            CC=gcc CXX=g++ AR=ar AS=as OBJCOPY=objcopy OBJDUMP=objdump SIZE=size \
            CARGO_TARGET_DIR="$THEKERNEL_CI_TARGET_DIR" \
            CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-C link-arg=-T$PWD/third_party/rust-patches/scope-local/percpu.x" \
            cargo check --locked --manifest-path kernel/Cargo.toml \
              --tests --features bpf --target x86_64-unknown-linux-gnu

      - name: Test host kernel profile
        run: |
          env \
            CC=gcc CXX=g++ AR=ar AS=as OBJCOPY=objcopy OBJDUMP=objdump SIZE=size \
            CARGO_TARGET_DIR="$THEKERNEL_CI_TARGET_DIR" \
            CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-C link-arg=-T$PWD/third_party/rust-patches/scope-local/percpu.x" \
            CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER="$PWD/scripts/ci/host-test-linker.sh" \
            cargo test --locked --manifest-path kernel/Cargo.toml \
              --tests --features bpf,axtask/test \
              --target x86_64-unknown-linux-gnu

      - name: Lint host kernel profile
        run: |
          env \
            CC=gcc CXX=g++ AR=ar AS=as OBJCOPY=objcopy OBJDUMP=objdump SIZE=size \
            CARGO_TARGET_DIR="$PWD/.state/ci/clippy-host" \
            CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-C link-arg=-T$PWD/third_party/rust-patches/scope-local/percpu.x" \
            cargo clippy --locked --manifest-path kernel/Cargo.toml \
              --tests --features bpf --target x86_64-unknown-linux-gnu -- \
              -D warnings \
              -A dead-code \
              -A clippy::drop-non-drop \
              -A clippy::too-many-arguments

  x86_64:
    name: x86_64 product configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    container:
      image: ${{ vars.THEKERNEL_DEV_IMAGE || format('ghcr.io/{0}/thekernel-dev:nightly', github.repository_owner) }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: TheKernel
    env:
      THEKERNEL_CI_TARGET_DIR: ${{ github.workspace }}/TheKernel/.state/ci/cargo-target
    steps:
      - name: Checkout TheKernel
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: TheKernel
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pinned vISA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: chenty2333/vISA
          ref: 198b1bdf7641717f52cd386752f0f25974db6d11
          path: vISA
          persist-credentials: false

      - name: Checkout pinned mechanism workspace
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: chenty2333/thekernel-ax
          ref: a9a89b0545e8af88213b39fb0ba050dbfeafc0b3
          path: thekernel-ax
          persist-credentials: false

      - name: Checkout pinned Linux ABI workspace
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: chenty2333/thekernel-linux-abi
          ref: 92ca5300541740037974a932615d1985aa218f9b
          path: thekernel-linux-abi
          persist-credentials: false

      - name: Cache Cargo outputs
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            TheKernel -> .state/ci/cargo-target
            TheKernel -> .state/x86_64/target
            TheKernel -> .state/x86_64/clippy-target

      - name: Trust mounted checkouts
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/TheKernel"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/vISA"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/thekernel-ax"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/thekernel-linux-abi"

      - name: Check diagnostic feature profile
        run: |
          env \
            CC=gcc CXX=g++ AR=ar AS=as OBJCOPY=objcopy OBJDUMP=objdump SIZE=size \
            CARGO_TARGET_DIR="$THEKERNEL_CI_TARGET_DIR" \
            CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-C link-arg=-T$PWD/third_party/rust-patches/scope-local/percpu.x" \
            cargo check --locked --manifest-path kernel/Cargo.toml \
              --tests --features bpf,asid-switch-diagnostics,pmu-diagnostics \
              --target x86_64-unknown-linux-gnu

      - name: Test I/O control feature profile
        run: |
          env \
            CC=gcc CXX=g++ AR=ar AS=as OBJCOPY=objcopy OBJDUMP=objdump SIZE=size \
            CARGO_TARGET_DIR="$THEKERNEL_CI_TARGET_DIR" \
            CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-C link-arg=-T$PWD/third_party/rust-patches/scope-local/percpu.x" \
            CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER="$PWD/scripts/ci/host-test-linker.sh" \
            cargo test --locked --manifest-path kernel/Cargo.toml \
              --tests --features bpf,test-io-control \
              --target x86_64-unknown-linux-gnu \
              pseudofs::io_test_control::tests -- --test-threads=1

      - name: Build x86_64 kernel
        run: make kernel-x86_64

      - name: Lint x86_64 product profile
        run: |
          set -euo pipefail
          package_args='-p thekernel -p thekernel-kernel -p axnet-ng -p axtask -p thekernel-linux-process-adapter -p thekernel-readiness-adapter'
          common=(
            -C "$PWD/make"
            "A=$PWD"
            ARCH=x86_64
            PLAT_CONFIG=platforms/axplat-x86-q35-uefi.toml
            SMP=4
            DEBUGINFO=y
            DWARF=n
            LOG=off
            BANNER=n
            BACKTRACE=n
            NO_AXSTD=y
            AX_LIB=axfeat
            BLK=y
            NET=y
            VSOCK=n
            MEM=1G
            LTO=
            MODE=release
            "STATE_DIR=$PWD/.state"
            'APP_FEATURES=qemu smp'
            "TARGET_DIR=$PWD/.state/x86_64/clippy-target"
          )
          make "${common[@]}" defconfig
          make "${common[@]}" \
            "CLIPPY_PACKAGES=$package_args" \
            'CLIPPY_ARGS=-- -D warnings -A dead-code -A clippy::drop-non-drop -A clippy::too-many-arguments' \
            clippy-elf
