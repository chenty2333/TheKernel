name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  # Maintained sibling inputs are source-controlled immutable release
  # candidates. Local development may still override their checkout paths.
  THEKERNEL_AX_REPOSITORY: https://github.com/chenty2333/thekernel-ax.git
  THEKERNEL_AX_REF: aa746a3898fdf3f85ed1270e460a41b9cbd5e6cf
  THEKERNEL_LINUX_ABI_REPOSITORY: https://github.com/chenty2333/thekernel-linux-abi.git
  THEKERNEL_LINUX_ABI_REF: e3e8c2b1f8b40ef5c9694981f17f71d1ff7d0c39

jobs:
  per-commit:
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.THEKERNEL_DEV_IMAGE || format('ghcr.io/{0}/thekernel-dev:latest', github.repository_owner) }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Trust checkout in job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Provision pinned maintained siblings
        run: ./scripts/ci/provision-maintained-siblings.sh

      - name: Per-commit gate
        id: gate
        run: ./scripts/ci/per-commit.sh

      - name: Upload gate logs
        if: ${{ always() && steps.gate.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: per-commit-logs
          path: .state/ci/per-commit/
          include-hidden-files: true

  # Full dual-architecture boot remains on the self-hosted QEMU runner. Root
  # images are built from this repository by the gate itself.
  dual-arch-pr:
    if: >-
      ${{ vars.THEKERNEL_QEMU_CI == '1' &&
          (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
    runs-on:
      - self-hosted
      - linux
      - thekernel-qemu
    container:
      image: ${{ vars.THEKERNEL_DEV_IMAGE || format('ghcr.io/{0}/thekernel-dev:latest', github.repository_owner) }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Trust checkout in job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Provision pinned maintained siblings
        run: ./scripts/ci/provision-maintained-siblings.sh

      - name: Dual-architecture release and boot gate
        id: gate
        run: ./scripts/ci/pr-gate.sh

      - name: Upload PR gate logs
        if: ${{ always() && steps.gate.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: dual-arch-pr-logs
          path: |
            .state/ci/pr/
            kernel-rv
            kernel-la
          include-hidden-files: true
