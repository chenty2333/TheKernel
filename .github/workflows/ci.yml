name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: thekernel-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"
  THEKERNEL_DEV_IMAGE: ${{ vars.THEKERNEL_DEV_IMAGE }}

jobs:
  image_ref:
    name: Resolve development image reference
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.validate.outputs.image }}
    steps:
      - name: Export configured development image
        id: validate
        env:
          IMAGE: ${{ vars.THEKERNEL_DEV_IMAGE }}
        run: |
          set -euo pipefail
          printf 'image=%s\n' "$IMAGE" >> "$GITHUB_OUTPUT"

  fast:
    name: Fast checks
    needs: image_ref
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ${{ needs.image_ref.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: TheKernel
    env:
      CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      THEKERNEL_CI_TARGET_DIR: ${{ github.workspace }}/TheKernel/.state/ci/cargo-target
    steps:
      - name: Checkout TheKernel
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: TheKernel
          fetch-depth: 0
          persist-credentials: false

      - name: Verify development image tools
        run: dev-env/check-image.sh

      - name: Load source combination
        id: source_combination
        run: python3 scripts/ci/source_combination.py --github-output "$GITHUB_OUTPUT"

      - name: Checkout mechanism workspace from source combination
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.source_combination.outputs.ax_repository }}
          ref: ${{ steps.source_combination.outputs.ax_ref }}
          path: ${{ steps.source_combination.outputs.ax_path }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout Linux implementation workspace from source combination
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.source_combination.outputs.linux_abi_repository }}
          ref: ${{ steps.source_combination.outputs.linux_abi_ref }}
          path: ${{ steps.source_combination.outputs.linux_abi_path }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust from the repository pin
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup show active-toolchain
          cargo install --locked --version 0.2.1 axconfig-gen
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Trust mounted checkouts
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/TheKernel"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/thekernel-ax"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/thekernel-linux-abi"

      - name: Check Cargo dependency layers
        run: python3 scripts/ci/check_cargo_dependency_layers.py

      - name: Check changed-line whitespace
        run: |
          set -euo pipefail
          if [[ -n "${CI_DIFF_BASE:-}" ]] \
              && git cat-file -e "${CI_DIFF_BASE}^{commit}" 2>/dev/null; then
            git diff --check "$CI_DIFF_BASE" HEAD --
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD --
          fi
          git diff --check
          git diff --cached --check

      - name: Inventory Linux v6.18 x86_64 syscall routing
        run: |
          python3 scripts/ci/linux_v618_abi_gate.py materialize \
            --linux-src "$GITHUB_WORKSPACE/TheKernel/.state/linux-v6.18"
          python3 scripts/ci/linux_v618_abi_gate.py inventory \
            --linux-src "$GITHUB_WORKSPACE/TheKernel/.state/linux-v6.18"

      - name: Validate Linux v6.18 syscall contract schema
        run: |
          python3 scripts/ci/linux_v618_abi_gate.py schema \
            --linux-src "$GITHUB_WORKSPACE/TheKernel/.state/linux-v6.18"

      - name: Check formatting
        run: |
          cargo fmt \
            -p thekernel \
            -p thekernel-kernel \
            -p thekernel-linux-process-adapter \
            -p thekernel-readiness-adapter \
            -- --check

      - name: Test product tools
        run: python3 -m unittest discover -s tests -t . -v

      - name: Validate checked-in graphics rootfs configuration
        run: scripts/build-graphics-rootfs.sh --check

      - name: Test local adapters
        run: |
          cargo test --locked -p thekernel-readiness-adapter
          cargo test --locked -p thekernel-linux-process-adapter

      - name: Check host kernel profile
        run: |
          env \
            CC=gcc CXX=g++ AR=ar AS=as OBJCOPY=objcopy OBJDUMP=objdump SIZE=size \
            CARGO_TARGET_DIR="$THEKERNEL_CI_TARGET_DIR" \
            CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-C link-arg=-T$PWD/../thekernel-ax/crates/thekernel-scope-local/percpu.x" \
            cargo check --locked --manifest-path kernel/Cargo.toml \
              --tests --features bpf --target x86_64-unknown-linux-gnu

      - name: Test host kernel profile
        run: |
          env \
            CC=gcc CXX=g++ AR=ar AS=as OBJCOPY=objcopy OBJDUMP=objdump SIZE=size \
            CARGO_TARGET_DIR="$THEKERNEL_CI_TARGET_DIR" \
            CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-C link-arg=-T$PWD/../thekernel-ax/crates/thekernel-scope-local/percpu.x" \
            CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER="$PWD/scripts/ci/host-test-linker.sh" \
            cargo test --locked --manifest-path kernel/Cargo.toml \
              --tests --features bpf,axtask/test \
              --target x86_64-unknown-linux-gnu -- --test-threads=1

      - name: Lint host kernel profile
        run: |
          env \
            CC=gcc CXX=g++ AR=ar AS=as OBJCOPY=objcopy OBJDUMP=objdump SIZE=size \
            CARGO_TARGET_DIR="$PWD/.state/ci/clippy-host" \
            CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-C link-arg=-T$PWD/../thekernel-ax/crates/thekernel-scope-local/percpu.x" \
            cargo clippy --locked --manifest-path kernel/Cargo.toml \
              --tests --features bpf --target x86_64-unknown-linux-gnu -- \
              -D warnings \
              -A dead-code \
              -A clippy::drop-non-drop \
              -A clippy::too-many-arguments

  product:
    name: x86_64 product
    needs: image_ref
    runs-on: ubuntu-24.04
    # The product gate compiles the kernel, runs its guest suite, and builds a
    # complete Buildroot desktop image from verified sources.
    timeout-minutes: 180
    container:
      image: ${{ needs.image_ref.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: TheKernel
    env:
      THEKERNEL_CI_TARGET_DIR: ${{ github.workspace }}/TheKernel/.state/ci/cargo-target
      # The Panther Lake runner consumes these exact files and never invokes a
      # build itself.  Keep the build products on the normal builder until the
      # single artifact hand-off below.
      THEKERNEL_STATE_DIR: ${{ github.workspace }}/TheKernel/.state/ci/product-artifacts
    steps:
      - name: Checkout TheKernel
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: TheKernel
          fetch-depth: 0
          persist-credentials: false

      - name: Verify development image tools
        run: dev-env/check-image.sh

      - name: Load source combination
        id: source_combination
        run: python3 scripts/ci/source_combination.py --github-output "$GITHUB_OUTPUT"

      - name: Checkout mechanism workspace from source combination
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.source_combination.outputs.ax_repository }}
          ref: ${{ steps.source_combination.outputs.ax_ref }}
          path: ${{ steps.source_combination.outputs.ax_path }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout Linux implementation workspace from source combination
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.source_combination.outputs.linux_abi_repository }}
          ref: ${{ steps.source_combination.outputs.linux_abi_ref }}
          path: ${{ steps.source_combination.outputs.linux_abi_path }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust from the repository pin
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup show active-toolchain
          cargo install --locked --version 0.2.1 axconfig-gen
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Trust mounted checkouts
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/TheKernel"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/thekernel-ax"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/thekernel-linux-abi"

      - name: Restore verified Buildroot package downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: TheKernel/.state/ci/graphics-downloads
          key: >-
            thekernel-buildroot-downloads-${{
            hashFiles('TheKernel/config/graphics/pins.env', 'TheKernel/config/graphics/*.config')
            }}

      - name: Build Q35 product image once
        run: |
          ./tools/thekernel.py build --smp 4

      - name: Lint Q35 product image
        run: |
          ./tools/thekernel.py lint --smp 4

      - name: Run Q35 guest system tests
        run: |
          ./tools/thekernel.py system-test \
            --smp 4 --accel tcg --no-build

      - name: Stage the single Panther Lake product hand-off
        run: |
          set -euo pipefail
          artifact_dir="$PWD/.state/ci/panther-lake-product"
          product_dir="$THEKERNEL_STATE_DIR/out/x86_64/q35-uefi/system/mem1g"
          mkdir -p "$artifact_dir"
          cp "$product_dir/kernel-x86_64" "$artifact_dir/kernel-x86_64"
          cp "$product_dir/kernel-x86_64.esp" "$artifact_dir/kernel-x86_64.esp"
          cp "$THEKERNEL_STATE_DIR/out/rootfs/x86/rootfs-x86.img" "$artifact_dir/rootfs-x86.img"
          test -s "$artifact_dir/kernel-x86_64"
          test -s "$artifact_dir/kernel-x86_64.esp"
          test -s "$artifact_dir/rootfs-x86.img"

      - name: Upload Panther Lake product hand-off
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: thekernel-panther-lake-product
          path: TheKernel/.state/ci/panther-lake-product
          if-no-files-found: error
          retention-days: 1

      - name: Build the Q35 seatd graphics rootfs
        run: |
          set -euo pipefail
          graphics_state="$PWD/.state/ci/graphics"
          scripts/build-graphics-rootfs.sh \
            --flavor q35-graphics-seatd \
            --fetch-buildroot \
            --buildroot-dir "$graphics_state/buildroot/buildroot-2026.05.2" \
            --output "$graphics_state/q35-graphics-seatd" \
            --download-dir "$PWD/.state/ci/graphics-downloads"

      - name: Run canonical Q35 seatd Pixman pixel oracle
        run: |
          set -euo pipefail
          graphics_state="$PWD/.state/ci/graphics"
          ./tools/thekernel.py graphics-smoke \
            --smp 4 \
            --accel tcg --timeout 300 \
            --rootfs "$graphics_state/q35-graphics-seatd/images/rootfs.ext2" \
            --flavor q35-graphics-seatd \
            --graphics-profile headless \
            --screenshot "$graphics_state/q35-graphics-seatd.ppm" \
            --workdir "$graphics_state/q35-graphics-seatd-run"

  panther-lake-dut:
    name: Panther Lake hardware certification
    needs: product
    runs-on: [self-hosted, linux, x64, thekernel-intel-panther-lake]
    timeout-minutes: 90
    # Do not build on the DUT.  Its protected runner configuration supplies
    # the power, UEFI one-shot boot, and serial-capture hooks; an incomplete
    # lab setup is a failure, never an implicit skip.
    env:
      THEKERNEL_DUT_POWER_CYCLE_CMD: ${{ vars.THEKERNEL_DUT_POWER_CYCLE_CMD }}
      THEKERNEL_DUT_BOOT_ONCE_CMD: ${{ vars.THEKERNEL_DUT_BOOT_ONCE_CMD }}
      THEKERNEL_DUT_SERIAL_CAPTURE_CMD: ${{ vars.THEKERNEL_DUT_SERIAL_CAPTURE_CMD }}
      THEKERNEL_DUT_STATE_DIR: ${{ vars.THEKERNEL_DUT_STATE_DIR }}
    steps:
      - name: Checkout gate script only
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download prebuilt product
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: thekernel-panther-lake-product
          path: dut-product

      - name: Require three clean cold boots
        shell: bash
        run: |
          set -euo pipefail
          : "${THEKERNEL_DUT_STATE_DIR:?set a persistent /home-backed DUT state directory}"
          python3 scripts/ci/panther_lake_dut_gate.py \
            --artifact-dir "$PWD/dut-product" \
            --state-dir "$THEKERNEL_DUT_STATE_DIR" \
            --runs 3

  graphics-fast:
    name: Graphics fast ABI and harness checks
    needs: image_ref
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ${{ needs.image_ref.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Reject incomplete graphics harness configuration
        run: |
          set -euo pipefail
          scripts/build-graphics-rootfs.sh --flavor q35-graphics-seatd --check
          scripts/build-graphics-rootfs.sh --flavor q35-software-desktop --check
          python3 -m py_compile tools/qemu_runner/graphics_metrics.py tools/qemu_runner/graphics_benchmark.py scripts/graphics-linux-oracle-runner.py

  graphics-software:
    name: Graphics software KVM correctness
    needs: [image_ref, graphics-fast]
    runs-on: [self-hosted, linux, x64, thekernel-kvm]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run software graphics benchmark
        run: |
          set -euo pipefail
          state="$PWD/.state/graphics-software"
          scripts/build-graphics-rootfs.sh --flavor q35-graphics-benchmark --output "$state/rootfs"
          scripts/graphics-linux-oracle.sh --rootfs "$state/rootfs/images/rootfs.ext2" --graphics-profile headless --output "$state/linux-oracle"
          ./tools/thekernel.py graphics-benchmark --rootfs "$state/rootfs/images/rootfs.ext2" --graphics-profile headless --workdir "$state/run" --timeout 1800 --linux-oracle-log "$state/linux-oracle/console.log"

  graphics-virgl-venus:
    name: Graphics Virgl and Venus KVM conformance
    needs: [image_ref, graphics-fast]
    runs-on: [self-hosted, linux, x64, thekernel-kvm-gl-vulkan]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build canonical seatd rootfs once for all accelerated profiles
        run: |
          set -euo pipefail
          state="$PWD/.state/graphics-virgl"
          scripts/build-graphics-rootfs.sh --flavor q35-graphics-seatd --output "$state/seatd-rootfs"
      - name: Run legacy Virgl from the canonical seatd rootfs
        run: |
          set -euo pipefail
          state="$PWD/.state/graphics-virgl"
          ./tools/thekernel.py graphics-smoke --rootfs "$state/seatd-rootfs/images/rootfs.ext2" --flavor q35-graphics-seatd --graphics-profile virgl-interactive --accel kvm --timeout 600 --workdir "$state/virgl-run" --screenshot "$state/virgl.ppm"
      - name: Run fixed Venus smoke without SKIP fallback
        run: |
          set -euo pipefail
          state="$PWD/.state/graphics-virgl"
          ./tools/thekernel.py graphics-smoke --rootfs "$state/seatd-rootfs/images/rootfs.ext2" --flavor q35-graphics-seatd --graphics-profile venus-interactive --accel kvm --timeout 600 --workdir "$state/venus-run" --screenshot "$state/venus.ppm"

  graphics-logind:
    name: Graphics logind and Sway session control
    needs: [image_ref, graphics-fast]
    runs-on: [self-hosted, linux, x64, thekernel-kvm-gl-vulkan]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Require real Sway readiness, not the launcher marker
        run: |
          set -euo pipefail
          state="$PWD/.state/graphics-logind"
          scripts/build-graphics-rootfs.sh --flavor q35-graphics-logind --output "$state/rootfs"
          ./tools/thekernel.py graphics-smoke --rootfs "$state/rootfs/images/rootfs.ext2" --flavor q35-graphics-logind --graphics-profile virgl-interactive --accel kvm --timeout 900 --workdir "$state/run" --screenshot "$state/sway.ppm"

  graphics-nightly:
    name: Graphics deterministic fault matrix
    needs: [image_ref, graphics-software, graphics-virgl-venus, graphics-logind]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, thekernel-kvm-gl-vulkan]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run each deterministic graphics fault once
        run: |
          set -euo pipefail
          state="$PWD/.state/graphics-nightly"
          for fault in modeset client-crash vt-switch weston-restart input-hotplug; do
            scripts/build-graphics-rootfs.sh --flavor q35-graphics-benchmark --fault "$fault" --output "$state/$fault-rootfs"
            scripts/graphics-linux-oracle.sh --rootfs "$state/$fault-rootfs/images/rootfs.ext2" --graphics-profile virgl-headless --fault "$fault" --output "$state/$fault-linux-oracle"
            ./tools/thekernel.py graphics-benchmark --rootfs "$state/$fault-rootfs/images/rootfs.ext2" --graphics-profile virgl-headless --workdir "$state/$fault" --timeout 1800 --fault "$fault" --linux-oracle-log "$state/$fault-linux-oracle/console.log"
          done
