name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: Repository verification tier
        type: choice
        options: [daily, full, hardware]
        default: daily

concurrency:
  group: thekernel-ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'schedule' && 'full' || inputs.tier || 'daily' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  PYTHONDONTWRITEBYTECODE: "1"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  verify:
    name: Repository verification
    if: github.event_name != 'workflow_dispatch' || inputs.tier != 'hardware'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.tier == 'full') && 360 || 150 }}
    env:
      CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      VERIFY_TIER: ${{ github.event_name == 'schedule' && 'full' || inputs.tier || 'daily' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build checked-in development environment
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: dev-env
          load: true
          push: false
          tags: thekernel-dev:local
          cache-from: type=gha,scope=thekernel-dev
          cache-to: type=gha,mode=max,scope=thekernel-dev
      - uses: ./.github/actions/setup-thekernel
      - name: Run repository verification
        run: scripts/dev-shell.sh -- ./tools/thekernel.py verify --tier "$VERIFY_TIER"

  hardware-availability:
    name: Hardware runner availability
    if: github.event_name == 'workflow_dispatch' && inputs.tier == 'hardware'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      available: ${{ steps.runners.outputs.available }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Require an online idle KVM runner
        id: runners
        env:
          # Runner inventory requires repository Administration:read. The
          # standard workflow token may not have it; fail visibly in that case.
          GH_TOKEN: ${{ secrets.THEKERNEL_RUNNER_READ_TOKEN || github.token }}
        run: python3 scripts/ci/check_hardware_runner.py

  hardware:
    name: Explicit CPU KVM verification
    needs: hardware-availability
    if: needs.hardware-availability.outputs.available == 'true'
    runs-on: [self-hosted, linux, x64, thekernel-kvm]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Provision pinned toolchain on the hardware host
        run: scripts/setup-toolchain.sh
      - name: Run repository hardware verification
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          ./tools/thekernel.py verify --tier hardware
