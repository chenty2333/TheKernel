name: CI

on:
  pull_request:
  push:
    # `dev` is the integration branch, so it is gated by the same pipeline as
    # `main`; a branch that only CI runs on pull requests stops being tested
    # the moment it is merged forward without a PR.
    branches: [main, dev]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: Repository verification tier
        type: choice
        options: [daily, full, hardware]
        default: daily

concurrency:
  group: thekernel-ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'schedule' && 'full' || inputs.tier || 'daily' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  PYTHONDONTWRITEBYTECODE: "1"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  schedule-changes:
    name: Check for new commits since the previous schedule
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.commit.outputs.run }}
    steps:
      - name: Compare with the previous scheduled run
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=schedule&per_page=10" \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID)] | max_by(.run_number) | .head_sha // \"\"") || {
              echo 'schedule: cannot read history; run verification rather than skip it'
              previous=
            }
          if [[ -n "$previous" && "$previous" == "$GITHUB_SHA" ]]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'schedule: no new commit; skipping the full and hardware tiers'
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'schedule: new commit or no history; running the full and hardware tiers'
          fi

  verify:
    name: Repository verification
    needs: schedule-changes
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.tier != 'hardware') && (github.event_name != 'schedule' || needs.schedule-changes.outputs.run == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.tier == 'full') && 360 || 150 }}
    env:
      CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      VERIFY_TIER: ${{ github.event_name == 'schedule' && 'full' || inputs.tier || 'daily' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build checked-in development environment
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dev-env
          load: true
          push: false
          tags: thekernel-dev:local
          cache-from: type=gha,scope=thekernel-dev
          cache-to: type=gha,mode=max,scope=thekernel-dev
      - uses: ./.github/actions/setup-thekernel
      - name: Run repository verification
        run: scripts/dev-shell.sh -- ./tools/thekernel.py verify --tier "$VERIFY_TIER"
      # Everything a failing guest leaves behind -- `console.log`, `kernel.log`,
      # `qemu-debug.log`, the fbcon and graphics screenshots -- is written under
      # the state root (`tools/product_state.py:state_root`), and this job runs
      # inside the compose container whose state root is the `thekernel-home`
      # named volume, not the workspace.  `upload-artifact` only sees the
      # workspace, so the evidence has to be copied out of the volume first.
      # Only on failure: a green run has nothing here worth keeping.
      - name: Collect failed run evidence from the container cache
        if: failure()
        run: |
          volume=$(docker volume ls \
            --filter 'label=com.docker.compose.project=thekernel-dev' \
            --filter 'label=com.docker.compose.volume=thekernel-home' \
            --format '{{.Name}}' | head -n1)
          if [ -z "$volume" ]; then
            echo 'evidence: no container cache volume; the run failed before booting'
            exit 0
          fi
          mkdir -p ci-evidence
          docker run --rm \
            -v "$volume:/state:ro" \
            -v "$PWD/ci-evidence:/evidence:z" \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            --user root --entrypoint bash \
            "${THEKERNEL_DEV_IMAGE:-thekernel-dev:local}" \
            -c 'set -eu
              # The volume is the container HOME (`dev-env/compose.yaml` mounts
              # `thekernel-home` at /home/thekernel, `dev-env/Dockerfile:146`
              # sets it), and the state root below HOME is where every run
              # directory lives.
              state=/state/.cache/thekernel-targets
              # `verify-graphics` is also the Buildroot source, download and
              # output tree (gigabytes); only its guest run and screenshot are
              # evidence, and a build failure is already in the job log.
              dirs=()
              for name in runs verify-fbcon verify-graphics/run verify-graphics/seatd.ppm; do
                if [ -e "$state/$name" ]; then
                  dirs+=("$name")
                fi
              done
              if [ "${#dirs[@]}" -eq 0 ]; then
                echo "evidence: cache volume holds no run directories"
                exit 0
              fi
              # OVMF variable stores and QMP sockets are not evidence, and a
              # socket cannot be archived.
              tar -C "$state" --exclude=firmware --exclude="*.sock" -cf - "${dirs[@]}" | tar -xf - -C /evidence
              chown -R "$HOST_UID:$HOST_GID" /evidence'
      - name: Upload failed run evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-evidence-${{ github.run_number }}-${{ github.run_attempt }}
          path: ci-evidence
          if-no-files-found: ignore
          retention-days: 14

  hardware-availability:
    name: Hardware runner availability
    # When main advances, the nightly schedule puts the Linux ABI differential
    # (`test --suite abi`, KVM-only) in front of anyone without a laptop open:
    # the `verify` job's `full` tier has no guest-ABI stage, so without this
    # second trigger the ABI guests only ever ran when somebody dispatched them.
    needs: schedule-changes
    if: ${{ !cancelled() && ((github.event_name == 'schedule' && needs.schedule-changes.outputs.run == 'true') || (github.event_name == 'workflow_dispatch' && inputs.tier == 'hardware')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      available: ${{ steps.runners.outputs.available }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Require an online idle KVM runner
        id: runners
        env:
          # Runner inventory requires repository Administration:read. The
          # standard workflow token may not have it; fail visibly in that case.
          GH_TOKEN: ${{ secrets.THEKERNEL_RUNNER_READ_TOKEN || github.token }}
          # On the schedule the runner is opportunistic -- a missing or
          # unreadable KVM pool at 03:17 must skip the lane, not redden the
          # night.  An explicit `tier=hardware` dispatch asked for that
          # evidence, so its absence stays an error.
          THEKERNEL_HARDWARE_OPTIONAL: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python3 scripts/ci/check_hardware_runner.py

  hardware:
    name: Explicit CPU and Linux ABI KVM verification
    needs: hardware-availability
    if: needs.hardware-availability.outputs.available == 'true'
    runs-on: [self-hosted, linux, x64, thekernel-kvm]
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Provision pinned toolchain on the hardware host
        run: scripts/setup-toolchain.sh
      - name: Run repository hardware verification
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          ./tools/thekernel.py verify --tier hardware
      # This job boots guests, so it is the one whose failure an operator has to
      # read.  The state root stays where it is -- redirecting it would throw
      # away the warm toolchain/Linux-oracle cache that keeps the KVM stages
      # inside their budget -- so the run directories are copied into the
      # workspace, which is the only place `upload-artifact` can read from.
      - name: Collect failed run evidence
        if: failure()
        run: |
          state="${THEKERNEL_STATE_DIR:-$HOME/.cache/thekernel-targets}"
          rm -rf ci-evidence
          mkdir -p ci-evidence
          found=0
          # As in the `verify` job, the graphics Buildroot tree is not evidence.
          for name in runs verify-fbcon verify-graphics/run verify-graphics/seatd.ppm; do
            if [ -e "$state/$name" ]; then
              mkdir -p "ci-evidence/$(dirname "$name")"
              cp -a "$state/$name" "ci-evidence/$name"
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "evidence: $state holds no run directories"
            exit 0
          fi
          find ci-evidence -name '*.sock' -delete
          du -sh ci-evidence
      - name: Upload failed run evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hardware-evidence-${{ github.run_number }}-${{ github.run_attempt }}
          path: ci-evidence
          if-no-files-found: ignore
          retention-days: 14
      # The runner's workspace survives the job, so an untracked directory left
      # here would be part of the next run's checkout.
      - name: Discard the local evidence copy
        if: always()
        run: rm -rf ci-evidence
