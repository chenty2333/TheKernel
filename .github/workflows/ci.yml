name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  # Non-secret repository variables. Refs must be exact published 40-hex
  # commits; an unset or unavailable input intentionally fails provisioning.
  THEKERNEL_AX_REPOSITORY: ${{ vars.THEKERNEL_AX_REPOSITORY }}
  THEKERNEL_AX_REF: ${{ vars.THEKERNEL_AX_REF }}
  THEKERNEL_LINUX_ABI_REPOSITORY: ${{ vars.THEKERNEL_LINUX_ABI_REPOSITORY }}
  THEKERNEL_LINUX_ABI_REF: ${{ vars.THEKERNEL_LINUX_ABI_REF }}

jobs:
  per-commit:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/chenty2333/thekernel-dev:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Trust checkout in job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Provision pinned maintained siblings
        run: ./scripts/ci/provision-maintained-siblings.sh

      - name: Per-commit gate
        id: gate
        run: ./scripts/ci/per-commit.sh

      - name: Upload gate logs
        if: ${{ always() && steps.gate.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: per-commit-logs
          path: .state/ci/per-commit/
          include-hidden-files: true

  # GitLab is the authoritative remote CI. This mirror becomes active only
  # when the GitHub repository is given a self-hosted runner with both official
  # root images mounted at /opt/oskernel/testsuites.
  dual-arch-pr:
    if: >-
      ${{ vars.THEKERNEL_QEMU_CI == '1' &&
          (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
    runs-on:
      - self-hosted
      - linux
      - thekernel-qemu
    container:
      image: ghcr.io/chenty2333/thekernel-dev:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --volume /opt/oskernel/testsuites:/opt/oskernel/testsuites:ro
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      OSCOMP_TESTSUITE_DIR: /opt/oskernel/testsuites
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Trust checkout in job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Provision pinned maintained siblings
        run: ./scripts/ci/provision-maintained-siblings.sh

      - name: Dual-architecture release and boot gate
        id: gate
        run: ./scripts/ci/pr-gate.sh

      - name: Upload PR gate logs
        if: ${{ always() && steps.gate.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: dual-arch-pr-logs
          path: |
            .state/ci/pr/
            kernel-rv
            kernel-la
          include-hidden-files: true
