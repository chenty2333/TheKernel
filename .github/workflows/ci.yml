name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: thekernel-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  fast:
    name: Fast checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      # An optional repository variable may override this known-good immutable
      # digest, but the override must also use ghcr.io/...@sha256:....  The
      # compiler itself remains controlled only by rust-toolchain.toml.
      image: ${{ vars.THEKERNEL_DEV_IMAGE || 'ghcr.io/chenty2333/thekernel-dev@sha256:ad06d4055a3987aa3dc6758267d8dae9b2187271680e837c0c87cdb59d2a38ef' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: TheKernel
    env:
      CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      THEKERNEL_CI_TARGET_DIR: ${{ github.workspace }}/TheKernel/.state/ci/cargo-target
    steps:
      - name: Checkout TheKernel
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: TheKernel
          fetch-depth: 0
          persist-credentials: false

      - name: Load source combination
        id: source_combination
        run: python3 scripts/ci/source_combination.py --github-output "$GITHUB_OUTPUT"

      - name: Checkout mechanism workspace from source combination
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.source_combination.outputs.ax_repository }}
          ref: ${{ steps.source_combination.outputs.ax_ref }}
          path: ${{ steps.source_combination.outputs.ax_path }}
          persist-credentials: false

      - name: Checkout Linux ABI workspace from source combination
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.source_combination.outputs.linux_abi_repository }}
          ref: ${{ steps.source_combination.outputs.linux_abi_ref }}
          path: ${{ steps.source_combination.outputs.linux_abi_path }}
          persist-credentials: false

      - name: Install Rust from the repository pin
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup show active-toolchain
          cargo install --locked --version 0.2.1 axconfig-gen
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Trust mounted checkouts
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/TheKernel"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/thekernel-ax"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/thekernel-linux-abi"

      - name: Check changed-line whitespace
        run: |
          set -euo pipefail
          if [[ -n "${CI_DIFF_BASE:-}" ]] \
              && git cat-file -e "${CI_DIFF_BASE}^{commit}" 2>/dev/null; then
            git diff --check "$CI_DIFF_BASE" HEAD --
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD --
          fi
          git diff --check
          git diff --cached --check

      - name: Check formatting
        run: |
          cargo fmt \
            -p thekernel \
            -p thekernel-kernel \
            -p axnet-ng \
            -p thekernel-linux-process-adapter \
            -p thekernel-readiness-adapter \
            -- --check

      - name: Validate vendored provenance
        run: |
          python3 scripts/ci/validate_vendor_provenance.py \
            --archive-policy if-present \
            --ax-repo ../thekernel-ax \
            --linux-abi-repo ../thekernel-linux-abi

      - name: Test product tools
        run: |
          python3 -m unittest tests.ci.test_source_combination -v
          python3 -m unittest discover -s tests/qemu_runner -v
          python3 -m unittest \
            tests.test_thekernel_system_test \
            tests.test_x86_uefi_esp \
            tests.ci.test_scheduler_baseline \
            tests.ci.test_kvm_subsystem_baseline \
            -v

      - name: Test local adapters
        run: |
          cargo test --locked -p thekernel-readiness-adapter
          cargo test --locked -p thekernel-linux-process-adapter

      - name: Run portable Linux differentials
        run: ./scripts/host-differential.sh

      - name: Check host kernel profile
        run: |
          env \
            CC=gcc CXX=g++ AR=ar AS=as OBJCOPY=objcopy OBJDUMP=objdump SIZE=size \
            CARGO_TARGET_DIR="$THEKERNEL_CI_TARGET_DIR" \
            CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-C link-arg=-T$PWD/third_party/rust-patches/scope-local/percpu.x" \
            cargo check --locked --manifest-path kernel/Cargo.toml \
              --tests --features bpf --target x86_64-unknown-linux-gnu

      - name: Test host kernel profile
        run: |
          env \
            CC=gcc CXX=g++ AR=ar AS=as OBJCOPY=objcopy OBJDUMP=objdump SIZE=size \
            CARGO_TARGET_DIR="$THEKERNEL_CI_TARGET_DIR" \
            CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-C link-arg=-T$PWD/third_party/rust-patches/scope-local/percpu.x" \
            CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER="$PWD/scripts/ci/host-test-linker.sh" \
            cargo test --locked --manifest-path kernel/Cargo.toml \
              --tests --features bpf,axtask/test,test-io-control \
              --target x86_64-unknown-linux-gnu -- --test-threads=1

      - name: Lint host kernel profile
        run: |
          env \
            CC=gcc CXX=g++ AR=ar AS=as OBJCOPY=objcopy OBJDUMP=objdump SIZE=size \
            CARGO_TARGET_DIR="$PWD/.state/ci/clippy-host" \
            CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-C link-arg=-T$PWD/third_party/rust-patches/scope-local/percpu.x" \
            cargo clippy --locked --manifest-path kernel/Cargo.toml \
              --tests --features bpf --target x86_64-unknown-linux-gnu -- \
              -D warnings \
              -A dead-code \
              -A clippy::drop-non-drop \
              -A clippy::too-many-arguments

  product:
    name: x86_64 product
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ${{ vars.THEKERNEL_DEV_IMAGE || 'ghcr.io/chenty2333/thekernel-dev@sha256:ad06d4055a3987aa3dc6758267d8dae9b2187271680e837c0c87cdb59d2a38ef' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: TheKernel
    env:
      THEKERNEL_CI_TARGET_DIR: ${{ github.workspace }}/TheKernel/.state/ci/cargo-target
    steps:
      - name: Checkout TheKernel
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: TheKernel
          fetch-depth: 0
          persist-credentials: false

      - name: Load source combination
        id: source_combination
        run: python3 scripts/ci/source_combination.py --github-output "$GITHUB_OUTPUT"

      - name: Checkout mechanism workspace from source combination
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.source_combination.outputs.ax_repository }}
          ref: ${{ steps.source_combination.outputs.ax_ref }}
          path: ${{ steps.source_combination.outputs.ax_path }}
          persist-credentials: false

      - name: Checkout Linux ABI workspace from source combination
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.source_combination.outputs.linux_abi_repository }}
          ref: ${{ steps.source_combination.outputs.linux_abi_ref }}
          path: ${{ steps.source_combination.outputs.linux_abi_path }}
          persist-credentials: false

      - name: Install Rust from the repository pin
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup show active-toolchain
          cargo install --locked --version 0.2.1 axconfig-gen
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Trust mounted checkouts
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/TheKernel"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/thekernel-ax"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/thekernel-linux-abi"

      - name: Lint x86_64 product profile
        run: |
          ./tools/thekernel.py lint --machine q35 --firmware uefi --smp 4
          ./tools/thekernel.py lint --machine q35 --firmware uefi --smp 4 \
            --profile mm-performance

      - name: Run q35 UEFI SMP4 TCG system test
        run: ./tools/thekernel.py system-test --machine q35 --firmware uefi --smp 4 --accel tcg
