# Reviewed baseline of module-level `use crate::…` edges inside the `thekernel`
# crate, enforced by scripts/ci/check_kernel_module_edges.py.
#
# The cargo manifest gates (scripts/ci/check_cargo_dependency_layers.py) see
# edges between packages only.  Within one crate a subsystem can reach another
# without a single manifest line changing, so this file is the review surface
# for that: an edge listed here is accepted, a new one fails the gate, and an
# edge that has been retired is reported so this list can shrink.
#
# Each entry is "<source> -> <target>", both sides a module directory or file
# under kernel/src.  A module using its own subtree (`crate::drm` from inside
# `drm`) is not coupling and is deliberately absent.  Nothing here is an
# endorsement: 89 edges across 18 modules is the measured starting point,
# and `drm -> file, mm, pseudofs, task, test_support` is exactly why
# `kernel/src/drm` cannot be lifted into `crates/drm` today without first
# inverting those five dependencies.  Adding an edge is a deliberate decision,
# so it should carry the reason in the change that adds it.
schema = 1

