[[contract]]
id = "v618-uretprobe"
flags = ["explicit-none"]
structs = ["struct:kernel RX trampoline saved frame {r11,rcx,rax}"]
multiplexer_commands = ["explicit-none"]
provider_ioctls = ["explicit-none"]
errno_order = ["errno:external or stale trampoline => SIGILL and return -1", "errno:saved-frame fault => SIGILL and return -1"]
usercopy = ["usercopy:nofault pin/read all three saved words before consuming return instances", "usercopy:validate saved rax before an all-pinned trampoline-frame rewrite"]
state = ["state:consume the equal-stack ReturnInstance chain only after provenance and saved-frame validation", "state:restore RIP RSP RAX RCX R11 and publish every retained return hit"]
concurrency = ["concurrency:mm trampoline generation and per-thread return stack are revalidated before commit"]
teardown = ["teardown:exec exit detach and last-consumer retirement invalidate trampoline ownership and stale return instances"]

[[contract]]
id = "v618-uprobe"
flags = ["explicit-none"]
structs = ["struct:kernel optimized-call trampoline saved frame {rax,r11,rcx}"]
multiplexer_commands = ["explicit-none"]
provider_ioctls = ["explicit-none"]
errno_order = ["errno:external invocation or stale token => ENXIO", "errno:saved-frame fault after live provenance => SIGILL and return -1"]
usercopy = ["usercopy:nofault pin/read the complete saved register frame before consuming the pending token"]
state = ["state:consume exactly one per-thread pending optimized-call token and restore consumer-visible registers"]
concurrency = ["concurrency:pending token binds task mm id XOL generation token and syscall stack under registry validation"]
teardown = ["teardown:fork rebinds only authorized pending state while exec exit and XOL replacement invalidate it"]

