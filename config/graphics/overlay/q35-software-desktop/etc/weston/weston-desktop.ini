[core]
backend=drm-backend.so
shell=desktop-shell.so
idle-time=0
xwayland=true

[xwayland]
path=/usr/local/bin/thekernel-desktop-xwayland

[shell]
locking=false
panel-position=top
background-color=0xff243447

[output]
name=Virtual-1
mode=preferred

[launcher]
icon=/usr/share/weston/terminal.png
displayname=Terminal
path=/usr/local/bin/thekernel-desktop-terminal

[launcher]
icon=/usr/share/icons/Adwaita/24x24/places/folder.png
displayname=Files
path=/usr/local/bin/thekernel-desktop-app files

[launcher]
icon=/usr/share/icons/Adwaita/24x24/legacy/accessories-text-editor.png
displayname=Text Editor
path=/usr/local/bin/thekernel-desktop-app editor

[launcher]
icon=/usr/share/icons/Adwaita/24x24/mimetypes/image-x-generic.png
displayname=Images
path=/usr/local/bin/thekernel-desktop-app images

[launcher]
icon=/usr/share/weston/icon_terminal.png
displayname=Python
path=/usr/local/bin/thekernel-desktop-app python

[launcher]
icon=/usr/share/icons/Adwaita/24x24/legacy/web-browser.png
displayname=Web Browser
path=/usr/local/bin/thekernel-desktop-app browser

[launcher]
icon=/usr/share/icons/Adwaita/24x24/legacy/system-shutdown.png
displayname=Shut Down
path=/usr/local/bin/thekernel-desktop-app shutdown

[autolaunch]
path=/usr/local/bin/thekernel-desktop-terminal
watch=false
