set timeout=0
set default=0

serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input serial
terminal_output serial

menuentry "Linux 7.2.3 benchmark oracle" {
    search --no-floppy --file --set=root /vmlinuz
    linux /vmlinuz root=/dev/vda rw rootwait console=ttyS0 init=/etc/thekernel/shell-init.sh
    boot
}
