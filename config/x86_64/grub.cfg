set timeout=0
set default=0

# The target machine (an Alder Lake-N mini PC) has no serial port, and its
# screen is the only output it has.  Asking for a serial terminal that is not
# there would leave GRUB with no terminal at all, so a failure at this stage
# -- an unreadable kernel, a bad module path -- would show nothing anywhere.
# Keeping `console` in both lists means the screen shows what GRUB says
# whether or not a UART answers.  This is measured, not assumed: on the
# firmware-fb profile the screen is untouched by GRUB without it, and carries
# GRUB's output with it.
#
# The screen is listed first because GRUB applies a terminal list in order and
# a machine whose firmware implements no legacy UART can still refuse the
# `serial` name.  Listing the screen first establishes the one output channel
# this machine certainly has before anything that might fail.  Both terminals
# are active either way, so a machine with a working UART is unaffected.
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input console serial
terminal_output console serial
insmod all_video

# Hand the firmware's video mode to the kernel instead of setting one.
# `insmod all_video` gives GRUB the means to call GOP SetMode, and its default
# payload policy uses them.  Firmware implementing exactly one mode -- common
# on the small boards this image targets -- fails that call, and a GRUB left
# with no usable video mode passes no Multiboot2 framebuffer tag at all, which
# is a kernel with no console anywhere.  Keeping the mode costs nothing: the
# kernel reads the mode out of the tag either way, and the firmware's own
# choice is already the panel's native mode.
set gfxpayload=keep

menuentry "TheKernel (Multiboot2)" {
    search --no-floppy --file --set=root /TheKernel.elf
    multiboot2 /TheKernel.elf
    module2 /rootfs-x86.img rootfs
    boot
}
