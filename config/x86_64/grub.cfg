set timeout=0
set default=0

# The target machine (an Alder Lake-N mini PC) has no serial port, and its
# screen is the only output it has.  Asking for a serial terminal that is not
# there would leave GRUB with no terminal at all, so a failure at this stage
# -- an unreadable kernel, a bad module path -- would show nothing anywhere.
# Keeping `console` in both lists means the screen shows what GRUB says
# whether or not a UART answers.  This is measured, not assumed: on the
# firmware-fb profile the screen is untouched by GRUB without it, and carries
# GRUB's output with it.
#
# Do **not** add `set gfxpayload=keep` here.  It looks like the safe choice --
# it avoids a GOP SetMode call that firmware implementing a single mode could
# fail -- and it was tried, measured, and reverted: with it, GRUB passes **no
# Multiboot2 framebuffer tag at all** on the firmware-fb profile (tag count 12
# instead of 13, no type-8 tag, kernel log reads `MB2 framebuffer: absent`),
# and a kernel with no framebuffer tag has no console anywhere.  GRUB's EFI
# path only fills in the video parameters when it has set a mode itself, so
# `keep` removes the very thing the kernel needs.  The hypothetical firmware
# this was meant to protect against is strictly less bad than the measured
# breakage: setting the mode that is already current is normally a successful
# no-op.  Leave the payload policy at its default.
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input serial console
terminal_output serial console
insmod all_video

menuentry "TheKernel (Multiboot2)" {
    search --no-floppy --file --set=root /TheKernel.elf
    multiboot2 /TheKernel.elf
    module2 /rootfs-x86.img rootfs
    boot
}
