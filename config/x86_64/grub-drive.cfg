set timeout=0
set default=0

# This configuration boots the same target machine as `grub.cfg`, which it
# matches line for line apart from taking its rootfs from a disk instead of a
# Multiboot2 module.  It needs the same property for the same measured reason:
# `console` must be in both terminal lists, or a machine with no UART has no
# GRUB terminal at all and anything GRUB has to say -- an unreadable kernel, a
# missing block device -- is said to nobody.
#
# `grub.cfg` records why `set gfxpayload=keep` must not be added here either:
# it removes the Multiboot2 framebuffer tag, which is the console.
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input serial console
terminal_output serial console
insmod all_video

menuentry "TheKernel (Multiboot2, drive rootfs)" {
    search --no-floppy --file --set=root /TheKernel.elf
    multiboot2 /TheKernel.elf
    boot
}
