set timeout=0
set default=0

# This configuration boots the same target machine as `grub.cfg` and needs the
# same two properties, for the same measured reasons; see that file for the
# evidence.  It differs only in taking its rootfs from a disk instead of a
# Multiboot2 module.
#
# `console` must be in both terminal lists: without it GRUB has no terminal at
# all on a machine with no UART, so anything GRUB has to say -- an unreadable
# kernel, a missing block device -- is said to nobody.  Listing the screen
# first establishes the certain output channel before the uncertain one.
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input console serial
terminal_output console serial
insmod all_video

# Keep the firmware's mode rather than setting one: see `grub.cfg`.  A GRUB
# that cannot set a mode passes no Multiboot2 framebuffer tag, and a kernel
# with no tag has no console.
set gfxpayload=keep

menuentry "TheKernel (Multiboot2, drive rootfs)" {
    search --no-floppy --file --set=root /TheKernel.elf
    multiboot2 /TheKernel.elf
    boot
}
