[package]
publish.workspace = true
rust-version.workspace = true
name = "thekernel"
version.workspace = true
edition.workspace = true
description.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# `cargo build` is the shipped x86_64 product, not an accidental reduced
# feature subset. Kernel/library host tests select their own manifests and
# feature sets explicitly.
default = ["x86-product"]
boot-shell = []
sched-wake-locality = ["tk-kernel/sched-wake-locality"]
io-submit-batch = ["tk-kernel/io-submit-batch"]
io-notify-fastpath = ["tk-kernel/io-notify-fastpath"]
# The Intel i225/i226 (igc) NIC work: builds the identify-only probe into the
# product kernel so a boot on a machine that has no such part produces the
# "no supported device present" verdict.  There is no QEMU model for this
# device, so that verdict is the only end-to-end run the driver has.
net-igc = ["tk-kernel/net-igc"]
# The shipped x86_64 product keeps its hardware-backed Linux ABI paths in one
# explicit opt-in.  CET and cachestat have no feature gate: both are always
# compiled, while their hardware use is capability-gated at runtime.
# A product ELF is always SMP-capable (bounded to the q35 profile's four
# logical CPUs) and is also valid when QEMU starts it with one CPU.
x86-product = ["qemu", "smp", "hwp-uclamp", "pmu", "perf-sampling"]
asid-fast-switch = ["tk-kernel/asid-fast-switch"]
hwp-uclamp = ["tk-kernel/hwp-uclamp"]
pmu = ["tk-kernel/pmu"]
perf-sampling = ["tk-kernel/perf-sampling"]
qemu = [
    "axfeat/defplat",
    "axfeat/bus-pci",

    "axfeat/display",
    "tk-kernel/rootfs-module",

    "tk-kernel/bpf",
    "tk-kernel/input",

    # auxilary features
    "axfeat/fs-ng-times",
]
smp = [
    "axfeat/smp",
    "tk-kernel/smp-tlb-shootdown",
    "tk-kernel/irq-continuation-diagnostics",
    "tk-kernel/idle-steal",
]

[[bin]]
name = "thekernel"
path = "src/main.rs"
required-features = ["qemu"]

[dependencies]
axfeat.workspace = true
tk-kernel.workspace = true

[package.metadata.vendor-filter]
platforms = [
    "x86_64-unknown-none",
]
all-features = true

[package.metadata.thekernel]
layer = "integration"
