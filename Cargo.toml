[workspace]
resolver = "2"
members = [
    "kernel",
    "crates/process-adapter",
    "crates/readiness-adapter",
    "crates/ax/*",
    "crates/linux/*",
]

# Lint policy for TheKernel-owned packages. Reusable components retain their
# explicit component lint policy.
#
# The enforced gate is `make lint`, i.e. `lint_kernel()` in tools/thekernel.py:
# one `cargo clippy --locked` run over the packages named by `LINT_PACKAGES`,
# for the product target and the product feature set, denying the `correctness`
# and `suspicious` Clippy groups.  It does not promote an ordinary warning to an
# error; `make lint-strict` is the opt-in escalation that adds the whole
# workspace on the host target with `-D warnings`.
#
# Every allowance must state the mechanism that makes the lint wrong for this
# codebase, not merely that it is inconvenient.
[workspace.lints.rust]
# `dead_code` answers a different question in every build configuration: a
# symbol unreachable in the qemu profile is frequently live under `smp`,
# `bpf`, `asid-fast-switch`, `perf-sampling`, or the host test profile.  The
# gate sees only the product configuration (and passes `-A dead-code` itself),
# so it cannot classify reachability truthfully; this allowance is what a direct
# `cargo clippy` or rust-analyzer run over another configuration inherits.
# Feature-local cleanup must use a narrow `cfg` or a separately reviewed
# allowance rather than inferred removal.
dead_code = "allow"

[workspace.lints.clippy]
# `mm::synchronize_tlb`/`synchronize_icache` return `GlobalGrace`, which only
# carries drop glue when `smp-tlb-shootdown` is enabled. Dropping the returned
# grace is the release point of a remote shootdown, so the explicit `drop(...)`
# is load-bearing in the shipped SMP configuration even where a uniprocessor or
# host build sees a unit struct. Removing these calls would be a silent
# correctness regression rather than a cleanup.
drop_non_drop = "allow"

# Public component contracts require callers to pass immutable snapshots,
# capabilities, and operation context explicitly instead of reading
# implicit kernel globals such as the current task or the global FD table.
# Wide signatures are the intended consequence of that rule; collapsing them
# into context structs purely to satisfy an arity threshold would re-introduce
# the ambient state the checks exist to remove.
too_many_arguments = "allow"

