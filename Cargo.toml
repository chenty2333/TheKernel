[package]
name = "thekernel"
version.workspace = true
edition.workspace = true
description.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# `cargo build` is the shipped x86_64 product, not an accidental reduced
# feature subset. Kernel/library host tests select their own manifests and
# feature sets explicitly.
default = ["x86-product"]
boot-shell = []
# The shipped x86_64 product keeps its hardware-backed Linux ABI paths in one
# explicit opt-in.  CET and cachestat have no feature gate: both are always
# compiled, while their hardware use is capability-gated at runtime.
# A product ELF is always SMP-capable (bounded to the q35 profile's four
# logical CPUs) and is also valid when QEMU starts it with one CPU.
x86-product = ["qemu", "smp", "hwp-uclamp", "pmu", "perf-sampling"]
asid-fast-switch = ["thekernel-kernel/asid-fast-switch"]
asid-switch-diagnostics = ["thekernel-kernel/asid-switch-diagnostics"]
mm-lock-diagnostics = ["thekernel-kernel/mm-lock-diagnostics"]
hwp-uclamp = ["thekernel-kernel/hwp-uclamp"]
pmu-diagnostics = ["thekernel-kernel/pmu-diagnostics"]
pmu = ["thekernel-kernel/pmu"]
perf-sampling = ["thekernel-kernel/perf-sampling"]
test-io-control = ["thekernel-kernel/test-io-control"]
qemu = [
    "axfeat/defplat",
    "axfeat/bus-pci",

    "axfeat/display",
    "thekernel-kernel/rootfs-module",

    "thekernel-kernel/bpf",
    "thekernel-kernel/input",

    # auxilary features
    "axfeat/fs-ng-times",
    "thekernel-kernel/dev-log",
]
smp = [
    "axfeat/smp",
    "thekernel-kernel/smp-tlb-shootdown",
    "thekernel-kernel/irq-continuation-diagnostics",
    "thekernel-kernel/idle-steal",
]
# EEVDF profile selection is compile time; the default is balanced.
eevdf-balanced = ["thekernel-kernel/eevdf-balanced"]
eevdf-latency = ["thekernel-kernel/eevdf-latency"]
eevdf-throughput = ["thekernel-kernel/eevdf-throughput"]

[[bin]]
name = "thekernel"
path = "src/main.rs"
required-features = ["qemu"]

[dependencies]
axfeat.workspace = true
thekernel-kernel.workspace = true

[package.metadata.vendor-filter]
platforms = [
    "x86_64-unknown-none",
]
all-features = true
