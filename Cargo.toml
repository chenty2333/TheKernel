[workspace]
resolver = "2"
members = [
    "kernel",
    "crates/axtask-compat",
    "crates/process-adapter",
    "crates/readiness-adapter",
]
exclude = ["arceos"]

[workspace.package]
version = "0.2.0-preview.2"
edition = "2024"
description = "A Linux-compatible OS kernel built on ArceOS unikernel"
license = "Apache-2.0"

authors = [
    "陈天意 <hi@tychen.cc>",
    "Azure-stars <Azure_stars@126.com>",
    "Yuekai Jia <equation618@gmail.com>",
    "KylinSoft Co., Ltd. <https://www.kylinos.cn/>",
    "朝倉水希 <asakuramizu111@gmail.com>",
    "Mivik <mivikq@gmail.com>",
]
homepage = "https://github.com/chenty2333/TheKernel"
repository = "https://github.com/chenty2333/TheKernel"

[workspace.dependencies]
axfeat = { version = "0.3.0-preview.2" }

axalloc = { version = "0.3.0-preview.2" }
axconfig = { version = "0.3.0-preview.2" }
axdisplay = { version = "0.3.0-preview.2" }
axdriver = { version = "0.3.0-preview.2" }
axfs = { version = "0.3.0-preview.2", package = "axfs-ng" }
axhal = { version = "0.3.0-preview.2" }
axinput = { version = "0.3.0-preview.2" }
axlog = { version = "0.3.0-preview.2" }
axmm = { version = "0.3.0-preview.2" }
axnet = { path = "crates/axnet-ng", package = "axnet-ng" }
axruntime = { version = "0.3.0-preview.2" }
axsync = { version = "0.3.0-preview.2" }
axpoll = { package = "thekernel-readiness-adapter", version = "=0.1.0", path = "crates/readiness-adapter" }
axcbpf = { package = "thekernel-axcbpf", version = "=0.1.0" }
axfault = { package = "thekernel-axfault", version = "=0.1.0" }
axtask = { package = "thekernel-axtask", version = "=0.1.0" }
linux-vfs = { package = "thekernel-linux-vfs", version = "=0.1.0" }
thekernel-linux-cred = { version = "=0.1.0", default-features = false }
thekernel-linux-fd = { version = "=0.1.0" }
thekernel-linux-io-uring = { version = "=0.1.0", default-features = false }
thekernel-linux-mm = { version = "=0.1.0", default-features = false }
thekernel-linux-process = { version = "=0.1.0", default-features = false }
thekernel-linux-seccomp = { version = "=0.1.0", default-features = false }
axtlb = { package = "thekernel-axtlb", version = "=0.1.0", default-features = false }
starry-process = { package = "thekernel-linux-process-adapter", version = "=0.1.0", path = "crates/process-adapter" }

thekernel-kernel = { path = "kernel", version = "=0.2.0-preview.2" }

[package]
name = "thekernel"
version.workspace = true
edition.workspace = true
description.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = []
boot-shell = []
test-io-control = ["thekernel-kernel/test-io-control"]
qemu = [
    "axfeat/defplat",
    "axfeat/bus-pci",

    "axfeat/display",

    "thekernel-kernel/bpf",
    "thekernel-kernel/input",

    # auxilary features
    "axfeat/fs-ng-times",
    "thekernel-kernel/dev-log",
]
smp = [
    "axfeat/smp",
    "thekernel-kernel/smp-tlb-shootdown",
    "thekernel-kernel/irq-continuation-diagnostics",
    "axplat-riscv64-visionfive2?/smp",
]

vf2 = ["dep:axplat-riscv64-visionfive2", "axfeat/driver-sdmmc"]

[[bin]]
name = "thekernel"
path = "src/main.rs"
required-features = ["qemu"]

[dependencies]
axfeat.workspace = true
thekernel-kernel.workspace = true

[dependencies.axplat-riscv64-visionfive2]
version = "0.1.0-pre.1"
features = ["fp-simd", "irq", "rtc"]
optional = true

[package.metadata.vendor-filter]
platforms = [
    "riscv64gc-unknown-none-elf",
    "loongarch64-unknown-none",
]
all-features = true

# Force all direct and transitive users onto the vendored axnet-ng so feature
# selection stays consistent across axruntime and the kernel.
[patch.crates-io]
axhal = { path = "third_party/rust-patches/axhal" }
axfeat = { path = "third_party/rust-patches/axfeat" }
axnet-ng = { path = "crates/axnet-ng" }
axdriver = { path = "third_party/rust-patches/axdriver" }
axdriver_block = { path = "third_party/rust-patches/axdriver_block" }
axdriver_virtio = { path = "third_party/rust-patches/axdriver_virtio" }
axio = { path = "third_party/rust-patches/axio" }
axcpu = { path = "third_party/rust-patches/axcpu" }
axfs-ng = { path = "third_party/rust-patches/axfs-ng" }
axfs-ng-vfs = { path = "third_party/rust-patches/axfs-ng-vfs" }
starry-vm = { path = "third_party/rust-patches/starry-vm" }
scope-local = { path = "third_party/rust-patches/scope-local" }
starry-signal = { path = "third_party/rust-patches/starry-signal" }
axtask = { path = "crates/axtask-compat" }
axruntime = { path = "third_party/rust-patches/axruntime" }
axsync = { path = "third_party/rust-patches/axsync" }
axplat-loongarch64-qemu-virt = { path = "third_party/rust-patches/axplat-loongarch64-qemu-virt" }
axplat-riscv64-qemu-virt = { path = "third_party/rust-patches/axplat-riscv64-qemu-virt" }
thekernel-axsched = { path = "../thekernel-ax/crates/thekernel-axsched" }
thekernel-axpoll = { path = "../thekernel-ax/crates/thekernel-axpoll" }
thekernel-axcbpf = { path = "../thekernel-ax/crates/thekernel-axcbpf" }
thekernel-axfault = { path = "../thekernel-ax/crates/thekernel-axfault" }
thekernel-axtask = { path = "../thekernel-ax/crates/thekernel-axtask" }
thekernel-axtlb = { path = "../thekernel-ax/crates/thekernel-axtlb" }
thekernel-linux-cred = { path = "../thekernel-linux-abi/crates/cred" }
thekernel-linux-mm = { path = "../thekernel-linux-abi/crates/mm" }
thekernel-linux-vfs = { path = "../thekernel-linux-abi/crates/vfs" }
thekernel-linux-fd = { path = "../thekernel-linux-abi/crates/fd" }
thekernel-linux-io-uring = { path = "../thekernel-linux-abi/crates/io-uring" }
thekernel-linux-process = { path = "../thekernel-linux-abi/crates/process" }
thekernel-linux-seccomp = { path = "../thekernel-linux-abi/crates/seccomp" }
thekernel-readiness-adapter = { path = "crates/readiness-adapter" }
memory_set = { path = "third_party/rust-patches/memory_set" }
page_table_multiarch = { path = "third_party/rust-patches/page_table_multiarch" }
kernel-elf-parser = { path = "third_party/rust-patches/kernel-elf-parser" }
lwext4_rust = { path = "third_party/rust-patches/lwext4_rust" }
starry-smoltcp = { path = "third_party/rust-patches/starry-smoltcp" }
starry-fatfs = { path = "third_party/rust-patches/starry-fatfs" }
virtio-drivers = { path = "third_party/rust-patches/virtio-drivers" }
