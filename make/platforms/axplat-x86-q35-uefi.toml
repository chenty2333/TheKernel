# q35 after OVMF PCI resource assignment. The package remains the existing
# Multiboot x86 PC platform; GRUB supplies its Multiboot handoff.
arch = "x86_64"
platform = "x86-pc"
package = "axplat-x86-pc"

[plat]
# The product q35 profile is an SMP kernel.  MADT discovery still determines
# the CPUs that actually exist; this is only the compile-time admission limit.
max-cpu-num = 4
phys-memory-base = 0
phys-memory-size = 0x0800_0000
kernel-base-paddr = 0x0020_0000
kernel-base-vaddr = "0xffff_8000_0020_0000"
phys-virt-offset = "0xffff_8000_0000_0000"
phys-bus-offset = 0
kernel-aspace-base = "0xffff_8000_0000_0000"
kernel-aspace-size = "0x0000_7fff_ffff_f000"
boot-stack-size = 0x0004_0000

[devices]
mmio-ranges = [
    [0x8000_0000, 0x2000_0000],       # OVMF 32-bit PCI BAR window
    [0xe000_0000, 0x1000_0000],       # OVMF PCIe ECAM
    [0xfec0_0000, 0x0000_1000],       # I/O APIC
    [0xfed0_0000, 0x0000_1000],       # HPET
    [0xfee0_0000, 0x0000_1000],       # Local APIC
    ["0x0000_00c0_0000_0000", 0x0100_0000], # OVMF 64-bit PCI BAR window
] # [(uint, uint)]
virtio-mmio-ranges = [] # [(uint, uint)]
pci-ecam-base = 0xe000_0000
pci-bus-end = 0xff
pci-ranges = [
    [0, 0],
    [0x8000_0000, 0x2000_0000],
    ["0x0000_00c0_0000_0000", 0x0100_0000],
] # [(uint, uint)]
timer-irq = 0xf0
ipi-irq = 0xf3
