name: thekernel-dev

x-common-env: &common-env
  # Compose is only a short-lived execution boundary.  It must never become
  # a boot or network daemon on the host.
  THEKERNEL_DEV_CONTAINER: "1"
  HOME: /home/thekernel
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_BUILD_JOBS: "${CARGO_BUILD_JOBS:-2}"
  CARGO_INCREMENTAL: "${CARGO_INCREMENTAL:-0}"
  CARGO_TERM_COLOR: "${CARGO_TERM_COLOR:-auto}"
  CI_DIFF_BASE: "${CI_DIFF_BASE:-}"
  LOCAL_UID: "${LOCAL_UID:-1000}"
  LOCAL_GID: "${LOCAL_GID:-1000}"

x-common-volumes: &common-volumes
  - type: bind
    source: ..
    target: /workspace
    bind:
      selinux: z
  - type: volume
    source: thekernel-home
    target: /home/thekernel

services:
  dev:
    image: ${THEKERNEL_DEV_IMAGE:-thekernel-dev:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEBIAN_MIRROR: "${THEKERNEL_DEBIAN_MIRROR:-http://deb.debian.org/debian}"
        DEBIAN_SECURITY_MIRROR: "${THEKERNEL_DEBIAN_SECURITY_MIRROR:-http://deb.debian.org/debian-security}"
    userns_mode: "${THEKERNEL_USERNS_MODE:-}"
    mem_limit: "${THEKERNEL_DEV_MEMORY:-8g}"
    memswap_limit: "${THEKERNEL_DEV_MEMORY:-8g}"
    working_dir: /workspace
    stdin_open: true
    tty: true
    init: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    environment: *common-env
    volumes: *common-volumes

volumes:
  thekernel-home:
