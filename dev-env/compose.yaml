name: thekernel-dev

x-common-env: &common-env
  HOME: /home/oskernel
  CARGO_HOME: /usr/local/cargo
  RUSTUP_HOME: /usr/local/rustup
  OSCOMP_TESTSUITE_DIR: /opt/oskernel/testsuites
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

x-common-volumes: &common-volumes
  - type: bind
    source: ..
    target: /workspace
  - type: volume
    source: thekernel-home
    target: /home/oskernel
  - type: volume
    source: thekernel-cargo
    target: /usr/local/cargo
  - type: volume
    source: thekernel-rustup
    target: /usr/local/rustup
  - type: bind
    source: ${OSCOMP_TESTSUITE_HOST_DIR}
    target: /opt/oskernel/testsuites
    read_only: true

services:
  dev:
    image: ${OSKERNEL_DEV_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEBIAN_IMAGE: ${DEBIAN_IMAGE}
        RUST_TOOLCHAIN: ${RUST_TOOLCHAIN}
        QEMU_VERSION: ${QEMU_VERSION}
        RISCV64_MUSL_TOOLCHAIN_URL: ${RISCV64_MUSL_TOOLCHAIN_URL}
        LOONGARCH64_MUSL_TOOLCHAIN_URL: ${LOONGARCH64_MUSL_TOOLCHAIN_URL}
    working_dir: /workspace
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    stdin_open: true
    tty: true
    init: true
    environment: *common-env
    volumes: *common-volumes

  builder:
    image: ${OSKERNEL_DEV_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEBIAN_IMAGE: ${DEBIAN_IMAGE}
        RUST_TOOLCHAIN: ${RUST_TOOLCHAIN}
        QEMU_VERSION: ${QEMU_VERSION}
        RISCV64_MUSL_TOOLCHAIN_URL: ${RISCV64_MUSL_TOOLCHAIN_URL}
        LOONGARCH64_MUSL_TOOLCHAIN_URL: ${LOONGARCH64_MUSL_TOOLCHAIN_URL}
    working_dir: /workspace
    user: "0:0"
    privileged: true
    stdin_open: true
    tty: true
    init: true
    profiles: ["builder"]
    environment: *common-env
    volumes: *common-volumes

volumes:
  thekernel-home:
  thekernel-cargo:
  thekernel-rustup:
