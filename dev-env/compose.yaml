name: thekernel-dev

x-common-env: &common-env
  HOME: /home/oskernel
  CARGO_HOME: /usr/local/cargo
  RUSTUP_HOME: /usr/local/rustup
  OSCOMP_TESTSUITE_DIR: /opt/oskernel/testsuites
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  LOCAL_UID: "${LOCAL_UID:-1000}"
  LOCAL_GID: "${LOCAL_GID:-1000}"

x-common-volumes: &common-volumes
  - type: bind
    source: ..
    target: /workspace
    bind:
      selinux: z
  - type: volume
    source: thekernel-home
    target: /home/oskernel
  - type: bind
    source: ${OSCOMP_TESTSUITE_HOST_DIR}
    target: /opt/oskernel/testsuites
    read_only: true

services:
  dev:
    image: ${OSKERNEL_DEV_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEBIAN_IMAGE: ${DEBIAN_IMAGE}
        RUST_TOOLCHAIN: ${RUST_TOOLCHAIN}
        QEMU_VERSION: ${QEMU_VERSION}
        QEMU_SHA256: ${QEMU_SHA256}
        LOONGARCH64_MUSL_TOOLCHAIN_URL: ${LOONGARCH64_MUSL_TOOLCHAIN_URL}
        LOONGARCH64_MUSL_TOOLCHAIN_SHA256: ${LOONGARCH64_MUSL_TOOLCHAIN_SHA256}
    working_dir: /workspace
    stdin_open: true
    tty: true
    init: true
    environment: *common-env
    volumes: *common-volumes

  builder:
    image: ${OSKERNEL_DEV_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEBIAN_IMAGE: ${DEBIAN_IMAGE}
        RUST_TOOLCHAIN: ${RUST_TOOLCHAIN}
        QEMU_VERSION: ${QEMU_VERSION}
        QEMU_SHA256: ${QEMU_SHA256}
        LOONGARCH64_MUSL_TOOLCHAIN_URL: ${LOONGARCH64_MUSL_TOOLCHAIN_URL}
        LOONGARCH64_MUSL_TOOLCHAIN_SHA256: ${LOONGARCH64_MUSL_TOOLCHAIN_SHA256}
    working_dir: /workspace
    privileged: true
    stdin_open: true
    tty: true
    init: true
    profiles: ["builder"]
    environment: *common-env
    volumes: *common-volumes

volumes:
  thekernel-home:
