name: thekernel-dev

x-common-env: &common-env
  HOME: /home/thekernel
  PYTHONDONTWRITEBYTECODE: "1"
  LOCAL_UID: "${LOCAL_UID:-1000}"
  LOCAL_GID: "${LOCAL_GID:-1000}"

x-common-volumes: &common-volumes
  - type: bind
    source: ..
    target: /workspace
    bind:
      selinux: z
  - type: volume
    source: thekernel-home
    target: /home/thekernel

services:
  dev:
    image: ${THEKERNEL_DEV_IMAGE:-thekernel-dev:local}
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    stdin_open: true
    tty: true
    init: true
    environment: *common-env
    volumes: *common-volumes

  builder:
    image: ${THEKERNEL_DEV_IMAGE:-thekernel-dev:local}
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    privileged: true
    stdin_open: true
    tty: true
    init: true
    profiles: ["builder"]
    environment: *common-env
    volumes: *common-volumes

volumes:
  thekernel-home:
