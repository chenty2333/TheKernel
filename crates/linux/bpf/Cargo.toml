[package]
publish.workspace = true
name = "tk-linux-bpf"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
authors = ["朝倉水希 <asakuramizu111@gmail.com>", "Mivik <mivikq@gmail.com>", "陈天意 <hi@tychen.cc>"]
description = "Pure Linux eBPF admission and lifecycle policy for no_std kernels"
license = "Apache-2.0"
repository.workspace = true
homepage = "https://github.com/chenty2333/TheKernel"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[dependencies]
bytemuck = { version = "1", default-features = false, features = ["derive"] }

[package.metadata.thekernel]
layer = "linux_abi"
