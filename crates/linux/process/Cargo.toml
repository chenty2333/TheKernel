[package]
name = "thekernel-linux-process"
version = "0.1.0"
edition = "2024"
authors = ["朝倉水希 <asakuramizu111@gmail.com>", "Mivik <mivikq@gmail.com>", "陈天意 <hi@tychen.cc>"]
description = "Explicit-domain, bounded process lifecycle state for no_std Linux ABI kernels"
license = "Apache-2.0"
repository = "https://github.com/chenty2333/thekernel-linux-abi"
homepage = "https://github.com/chenty2333/thekernel-linux-abi"
readme = "README.md"
keywords = ["kernel", "linux", "no-std", "process"]
categories = ["no-std", "os"]

[features]
default = []

[dependencies]
bytemuck = { version = "1.24", default-features = false, features = ["derive"] }
intrusive-collections = "0.9"
kspin = { version = "0.1", features = ["smp"] }

[package.metadata.docs.rs]
all-features = true

[package.metadata.thekernel]
layer = "linux_abi"
toolchain = "nightly"
nightly-features = ["allocator_api"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
