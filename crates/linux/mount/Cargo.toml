[package]
publish = ["crates-io"]
name = "tk-linux-mount"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
authors = ["朝倉水希 <asakuramizu111@gmail.com>", "Mivik <mivikq@gmail.com>", "陈天意 <hi@tychen.cc>"]
description = "Bounded mount namespace topology and transaction planning contracts"
license = "Apache-2.0"
repository.workspace = true
homepage = "https://github.com/chenty2333/TheKernel"
keywords = ["kernel", "linux", "no-std", "mount"]
categories = ["no-std", "os"]

[features]
default = []

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[package.metadata.thekernel]
layer = "linux_abi"
