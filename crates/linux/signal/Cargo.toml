[package]
publish = ["crates-io"]
rust-version.workspace = true
name = "tk-linux-signal"
version = "0.1.0"
edition = "2024"
authors = ["朝倉水希 <asakuramizu111@gmail.com>", "Mivik <mivikq@gmail.com>", "陈天意 <hi@tychen.cc>"]
description = "Bounded signal queues and explicit-usercopy frames for no_std Linux ABI kernels"
license = "Apache-2.0"
repository.workspace = true
homepage = "https://github.com/chenty2333/TheKernel"
readme = "README.md"
keywords = ["kernel", "linux", "no-std", "signal"]
categories = ["no-std", "os"]

[features]
default = []

[dependencies]
bitflags = "2.6"
bytemuck = { version = "1.24", default-features = false, features = ["derive"] }
derive_more = { version = "2.0", default-features = false, features = ["full"] }
kspin = { version = "0.1", features = ["smp"] }
linux-raw-sys = { version = "0.12", default-features = false, features = ["general", "no_std"] }
log = "0.4"
spin = { version = "0.10", default-features = false, features = ["mutex", "spin_mutex"] }
strum = { version = "0.27", default-features = false, features = ["derive"] }
tk-linux-usercopy = { path = "../usercopy", version = "0.1.0" }
x86_64 = { version = "=0.15.5", default-features = false }

[package.metadata.docs.rs]
all-features = true

[package.metadata.thekernel]
layer = "linux_abi"
# The root rust-toolchain.toml pins nightly-2026-08-23 (rustc 1.100.0-nightly).
# The inherited rust-version is not a stable-Rust promise; allocator_api is required.
toolchain = "nightly"
nightly-features = ["allocator_api"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
