[package]
name = "thekernel-linux-io-uring"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["朝倉水希 <asakuramizu111@gmail.com>", "Mivik <mivikq@gmail.com>", "陈天意 <hi@tychen.cc>"]
description = "Bounded generation-safe Linux io_uring policy core for no_std kernels"
license = "Apache-2.0"
repository = "https://github.com/chenty2333/thekernel-linux-abi"
homepage = "https://github.com/chenty2333/thekernel-linux-abi"
readme = "README.md"
keywords = ["kernel", "linux", "no-std", "io-uring"]
categories = ["no-std", "os"]

[features]
default = []

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[package.metadata.thekernel]
layer = "linux_abi"
