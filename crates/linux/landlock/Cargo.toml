[package]
name = "thekernel-linux-landlock"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Bounded immutable filesystem access-policy planning for TheKernel"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[package.metadata.thekernel]
layer = "linux_abi"
