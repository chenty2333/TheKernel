# NOTE: this TheKernel-local manifest enables only the legacy `axplat`
# interface (crates.io ecosystem). The tgoskits copy of this crate carries
# the same sources plus the default `ax-plat` (tgoskits) interface with its
# workspace-internal dependencies.
[package]
name = "axplat-bcm2837-zero2w"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
description = "ArceOS platform implementation for the Raspberry Pi Zero 2W (BCM2710A1/BCM2837)"
keywords = ["arceos", "os", "hal", "embedded", "raspberry-pi"]
categories = ["embedded", "no-std", "hardware-support", "os"]
license.workspace = true
repository.workspace = true
build = "build.rs"

[features]
default = []
irq = []
smp = []
# TheKernel-style legacy `axplat` interface (crates.io `axplat` 0.3.x).
legacy = ["dep:axcpu-old", "dep:axplat-old", "axplat-old/irq", "dep:memory-addr-old"]

[dependencies]
kspin = "0.1"
log = "0.4"
# Legacy interface (TheKernel): old crates.io `axplat` platform contract.
axcpu-old = { package = "axcpu", version = "0.3.0-preview.7", optional = true }
axplat-old = { package = "axplat", version = "0.3.1-pre.6", optional = true }
memory-addr-old = { package = "memory_addr", version = "0.2", optional = true }

[package.metadata.axplat]
platform = "bcm2837-zero2w"
arch = "aarch64"
crate = "axplat_bcm2837_zero2w"
dynamic = false
