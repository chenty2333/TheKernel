[package]
publish = ["crates-io"]
name = "tk-axbpf"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
authors = ["TheKernel contributors"]
description = "Policy-neutral, capability-safe eBPF verifier and interpreter"
license = "Apache-2.0"
repository.workspace = true

[lib]
name = "axbpf"
path = "src/lib.rs"

[dependencies]
bytemuck = { version = "1", default-features = false, features = ["derive"] }

[package.metadata.thekernel]
layer = "mechanism"
