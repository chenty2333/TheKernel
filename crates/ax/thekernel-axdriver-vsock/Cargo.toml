[package]
name = "thekernel-axdriver-vsock"
version = "0.1.4-preview.3"
edition = "2021"
authors = ["Yuekai Jia <equation618@gmail.com>", "朝倉水希 <asakuramizu111@gmail.com>", "Yu Chen <yuchen@tsinghua.edu.cn>"]
description = "Common traits and types for vsock drivers"
license = "GPL-3.0-or-later OR Apache-2.0 OR MulanPSL-2.0"
homepage = "https://github.com/arceos-org/arceos"
repository = "https://github.com/arceos-org/axdriver_crates"

[features]
default = []

[lib]
name = "axdriver_vsock"
path = "src/lib.rs"

[dependencies]
axdriver_base = { package = "thekernel-axdriver-base", path = "../thekernel-axdriver-base", version = "0.1.4-preview.3" }
log = "0.4"

[package.metadata.thekernel]
layer = "platform"
