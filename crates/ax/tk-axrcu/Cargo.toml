[package]
publish.workspace = true
name = "tk-axrcu"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
authors = ["TheKernel contributors"]
description = "Bounded epoch publication and task-context reclamation primitives"
license = "Apache-2.0"
repository.workspace = true

[lib]
name = "axrcu"
path = "src/lib.rs"

[dependencies]
kspin = { version = "0.1", features = ["smp"] }

[dev-dependencies]
static_assertions = "1.1"

[package.metadata.thekernel]
layer = "mechanism"
