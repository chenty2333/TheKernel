[package]
name = "tk-intel-gt"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license = "MIT"
authors = ["TheKernel contributors"]
description = "N305 Gen12 BCS i915 translations with explicit execution ownership"
repository.workspace = true

[package.metadata.thekernel]
layer = "mechanism"

[lints]
workspace = true

[features]
default = []
# Keep the source-order Linux 7.2.3 translations opt-in until their LinuxKPI
# bindings are complete. This is deliberately not enabled by the product.
upstream-gt = ["dep:axlog", "dep:kernel_guard", "dep:axhal", "dep:axtask"]

[dependencies]
axlog = { workspace = true, optional = true }

[dependencies.kernel_guard]
version = "0.1"
optional = true
features = ["preempt"]

[dependencies.axhal]
package = "tk-axhal"
path = "../tk-axhal"
version = "0.1.0"
optional = true

[dependencies.axtask]
package = "tk-axtask"
path = "../tk-axtask"
version = "0.1.0"
optional = true
features = ["multitask"]
