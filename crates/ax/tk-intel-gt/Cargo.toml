[package]
name = "tk-intel-gt"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license = "MIT"
authors = ["TheKernel contributors"]
description = "N305 Gen12 BCS i915 translations with explicit execution ownership"
repository.workspace = true

[package.metadata.thekernel]
# The translated driver now consumes the allocator, HAL, memory and task runtime.
layer = "platform"

[package.metadata.thekernel.host-test]
selected = true
percpu-linker = true

[lints]
workspace = true

[features]
default = []
drm-i915-capture-error = []

[dependencies]
axlog = { workspace = true }
axdriver_base = { package = "tk-axdriver-base", path = "../tk-axdriver-base", version = "0.1.0" }
mmu_notifier = { workspace = true }
tk-linux-kapi = { path = "../tk-linux-kapi" }
tk-drm-upstream = { path = "../tk-drm-upstream" }

[dependencies.kernel_guard]
version = "0.1"
features = ["preempt"]

[dependencies.axhal]
package = "tk-axhal"
path = "../tk-axhal"
version = "0.1.0"
features = ["irq"]

[dependencies.axtask]
package = "tk-axtask"
path = "../tk-axtask"
version = "0.1.0"
features = ["multitask", "preempt"]

[dependencies.axmm]
workspace = true

[dependencies.memory_addr]
version = "0.4"

[dependencies.spin]
version = "0.9"

[dependencies.axalloc]
package = "tk-axalloc"
path = "../tk-axalloc"

[dependencies.tk-vtd]
path = "../tk-vtd"

[dependencies.printf-compat]
version = "0.4"
default-features = false
