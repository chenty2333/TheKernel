[package]
name = "tk-acpica"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license = "Apache-2.0 AND BSD-3-Clause"
description = "Freestanding ACPICA interpreter and Rust operating-system services"

[build-dependencies]
cc = "1"

[package.metadata.thekernel]
layer = "mechanism"

[features]
host = []

[package.metadata.thekernel.host-test]
features = ["host"]

[[example]]
name = "table_probe"
required-features = ["host"]
