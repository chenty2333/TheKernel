[package]
edition = "2024"
name = "thekernel-axfeat"
version = "0.3.0-preview.2"
authors = ["Yuekai Jia <equation618@gmail.com>"]
description = "Top-level feature selection for ArceOS"
license = "GPL-3.0-or-later OR Apache-2.0 OR MulanPSL-2.0"
homepage = "https://github.com/arceos-org/arceos"
repository = "https://github.com/arceos-org/arceos/tree/main/api/axfeat"

[features]
default = []

alloc = ["axalloc", "axruntime/alloc"]
alloc-buddy = ["axalloc/buddy"]
alloc-level-1 = ["axalloc/level-1", "alloc"]
alloc-slab = ["axalloc/slab"]
alloc-tlsf = ["axalloc/tlsf"]
bus-mmio = ["axdriver?/bus-mmio"]
bus-pci = ["axdriver?/bus-pci"]
defplat = ["axhal/defplat"]
display = [
    "alloc",
    "paging",
    "axdriver/virtio-gpu",
    "dep:axdisplay",
    "axruntime/display",
]
dma = [
    "alloc",
    "paging",
]
driver-ahci = ["axdriver?/ahci"]
driver-ixgbe = ["axdriver?/ixgbe"]
driver-ramdisk = ["axdriver?/ramdisk"]
dwarf = [
    "alloc",
    "axbacktrace/dwarf",
]
fp-simd = ["axhal/fp-simd"]
fs-ng = [
    "alloc",
    "paging",
    "axdriver/virtio-blk",
    "axruntime/fs-ng",
]
fs-ng-ext4 = [
    "fs-ng",
    "axfs-ng/ext4",
]
fs-ng-fat = [
    "fs-ng",
    "axfs-ng/fat",
]
fs-ng-times = [
    "fs-ng",
    "axfs-ng/times",
]
hv = ["axhal/hv"]
input = [
    "alloc",
    "paging",
    "axdriver/virtio-input",
    "dep:axinput",
    "axruntime/input",
]
ipi = [
    "irq",
    "axhal/ipi",
    "axruntime/ipi",
]
irq = [
    "axhal/irq",
    "axruntime/irq",
    "axtask?/irq",
    "axdriver?/irq",
]
multitask = [
    "alloc",
    "axtask/multitask",
    "axsync/multitask",
    "axruntime/multitask",
]
myplat = ["axhal/myplat"]
net-ng = [
    "alloc",
    "paging",
    "axdriver/virtio-net",
    "irq",
    "multitask",
    "axruntime/net-ng",
]
net-ng-loopback = [
    "alloc",
    "paging",
    "irq",
    "multitask",
    "axruntime/net-ng",
]
page-alloc-4g = ["axalloc/page-alloc-4g"]
page-alloc-64g = ["axalloc/page-alloc-64g"]
paging = [
    "alloc",
    "axhal/paging",
    "axruntime/paging",
]
rtc = [
    "axhal/rtc",
    "axruntime/rtc",
]
rng = [
    "alloc",
    "paging",
    "axdriver/virtio-rng",
]
sched-eevdf = [
    "axtask/sched-eevdf",
    "irq",
]
sched-fifo = ["axtask/sched-fifo"]
sched-rr = [
    "axtask/sched-rr",
    "irq",
]
smp = [
    "axhal/smp",
    "axruntime/smp",
    "axtask?/smp",
    "kspin/smp",
]
task-ext = ["axtask/task-ext"]
tls = [
    "alloc",
    "axhal/tls",
    "axruntime/tls",
    "axtask?/tls",
]
uspace = ["axhal/uspace"]
vsock = ["axruntime/vsock"]

[lib]
name = "axfeat"
path = "src/lib.rs"

[dependencies]
axalloc = { package = "thekernel-axalloc", path = "../thekernel-axalloc", version = "=0.3.0-preview.2", optional = true }
axbacktrace = "0.1"
axconfig = { version = "=0.3.0-preview.2", optional = true }
axdisplay = { package = "thekernel-axdisplay", path = "../thekernel-axdisplay", version = "=0.3.0-preview.2", optional = true }
axdriver = { package = "thekernel-axdriver", path = "../thekernel-axdriver", version = "=0.3.0-preview.2", optional = true }
axfs-ng = { package = "thekernel-axfs-ng", path = "../thekernel-axfs-ng", version = "=0.3.0-preview.2", optional = true }
axhal = { package = "thekernel-axhal", path = "../thekernel-axhal", version = "=0.3.0-preview.2" }
axinput = { package = "thekernel-axinput", path = "../thekernel-axinput", version = "=0.3.0-preview.2", optional = true }
axlog = { version = "=0.3.0-preview.2" }
axruntime = { package = "thekernel-axruntime", path = "../thekernel-axruntime", version = "=0.3.0-preview.2" }
axsync = { package = "thekernel-axsync", path = "../thekernel-axsync", version = "=0.3.0-preview.2", optional = true }
axtask = { package = "thekernel-axtask", path = "../thekernel-axtask", version = "=0.1.0", optional = true }
kspin = { version = "0.1", optional = true }

[package.metadata.thekernel]
layer = "platform"
