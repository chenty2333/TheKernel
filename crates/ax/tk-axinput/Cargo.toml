[package]
publish.workspace = true
rust-version.workspace = true
edition = "2024"
name = "tk-axinput"
version = "0.1.0"
authors = ["Yuekai Jia <equation618@gmail.com>"]
description = "Input device management for ArceOS"
license = "GPL-3.0-or-later OR Apache-2.0 OR MulanPSL-2.0"
homepage = "https://github.com/arceos-org/arceos"
repository.workspace = true
keywords = ["arceos", "kernel"]
categories = ["os", "no-std"]

[lib]
name = "axinput"
path = "src/lib.rs"

[dependencies]
axdriver = { package = "tk-axdriver", path = "../tk-axdriver", version = "0.1.0", features = ["input"] }
axsync = { package = "tk-axsync", path = "../tk-axsync", version = "0.1.0" }
lazyinit = "0.2"
log = "0.4"

[package.metadata.thekernel]
layer = "platform"
