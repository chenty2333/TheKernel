# Standard ALSA hw plugin, no OSS/plugin adapter or format conversion.
pcm.hw {
    @args [ CARD DEV SUBDEV ]
    @args.CARD { type integer default 0 }
    @args.DEV { type integer default 0 }
    @args.SUBDEV { type integer default -1 }
    type hw
    card $CARD
    device $DEV
    subdevice $SUBDEV
}
