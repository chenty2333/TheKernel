[package]
name = "thekernel-kernel"
version.workspace = true
edition.workspace = true
description.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
bpf = []
asid-fast-switch = ["axhal/asid-fast-switch"]
asid-switch-diagnostics = ["asid-fast-switch", "axhal/asid-switch-diagnostics"]
dev-log = []
input = ["dep:axinput", "axfeat/input"]
memtrack = ["axfeat/dwarf", "axalloc/tracking", "dep:gimli"]
mm-lock-diagnostics = []
pmu-diagnostics = ["dep:axpmu"]
test-io-control = ["axfs/test-io-control"]
vsock = ["axfeat/vsock"]
smp-tlb-shootdown = ["axruntime/ipi", "axtask/remote-resched"]
irq-continuation-diagnostics = ["axtask/irq-continuation-diagnostics"]
# EEVDF profiles are immutable compile-time choices. With no profile feature
# the scheduler crate selects balanced, preserving its historical constants.
eevdf-balanced = ["axtask/eevdf-balanced"]
eevdf-latency = ["axtask/eevdf-latency"]
eevdf-throughput = ["axtask/eevdf-throughput"]
# The product's SMP build keeps pull-only idle stealing enabled explicitly;
# the axtask feature itself supplies the SMP+EEVDF prerequisites.
idle-steal = ["axtask/idle-steal"]

[dependencies]
axfeat = { workspace = true, features = [
    "fp-simd",
    "irq",
    "uspace",

    "page-alloc-4g",
    "alloc-slab",

    "multitask",
    "task-ext",
    "sched-eevdf",

    "rtc",
    "rng",

    "fs-ng-ext4",
    "fs-ng-fat",
    "net-ng",
] }

axalloc.workspace = true
axconfig.workspace = true
axdisplay.workspace = true
axdriver.workspace = true
axfs = { workspace = true, features = ["task-io-accounting"] }
axhal = { workspace = true, features = ["pkeys"] }
axinput = { workspace = true, optional = true }
axlog.workspace = true
axmm.workspace = true
axnet.workspace = true
axruntime = { workspace = true, features = ["irq-exit"] }
axsync.workspace = true
axtask = { workspace = true, features = ["legacy-fxsave", "pkeys"] }

axbacktrace = "0.1"
axcbpf.workspace = true
axerrno = "0.2"
axfs-ng-vfs = "0.1"
axio = "0.3.0-pre.1"
axpoll.workspace = true
axfault.workspace = true
axrcu.workspace = true
axpmu = { workspace = true, optional = true }
thekernel-linux-cred.workspace = true
thekernel-linux-fd.workspace = true
thekernel-linux-io-uring.workspace = true
thekernel-linux-mm.workspace = true
thekernel-linux-packet.workspace = true
thekernel-linux-rseq.workspace = true
thekernel-linux-seccomp.workspace = true
thekernel-linux-signal.workspace = true
thekernel-linux-usercopy = { workspace = true, features = ["alloc"] }
axtlb.workspace = true
bitflags = "2.10"
bitmaps = { version = "3.2", default-features = false }
bytemuck = { version = "1.23", features = ["unsound_ptr_pod_impl", "derive"] }
cfg-if = "1.0"
crate_interface = "0.1"
chrono = { version = "0.4", default-features = false }
chacha20 = { version = "0.9.1", default-features = false }
downcast-rs = { version = "2.0", default-features = false, features = ["sync"] }
enum_dispatch = "0.3"
event-listener = { version = "5.4", default-features = false }
extern-trait = "0.4"
flatten_objects = "0.2.4"
gimli = { version = "0.33", default-features = false, optional = true }
hashbrown = "0.16"
indoc = "2"
inherit-methods-macro = "0.1.0"
kernel_guard = "0.1"
kernel-elf-parser = "0.3.4"
kspin = "0.1"
lazy_static = { version = "1.5", features = ["spin_no_std"] }
linkme = "0.3"
linux-vfs.workspace = true
linux-raw-sys = { version = "0.12", default-features = false, features = [
    "no_std",
    "general",
    "if_packet",
    "net",
    "prctl",
    "system",
    "ioctl",
    "io_uring",
    "loop_device",
    "mempolicy",
] }
lock_api = { version = "0.4", features = ["arc_lock"] }
memory_addr = "0.4"
memory_set = "0.4"
num_enum = { version = "0.7", default-features = false }
ouroboros = { version = "0.18", default-features = false }
percpu = { version = "0.2.3-preview.1", features = ["non-zero-vma"] }
rand = { version = "0.10", default-features = false, features = ["alloc"] }
ringbuf = { version = "0.4.8", default-features = false, features = ["alloc"] }
scope-local = "0.1"
slab = { version = "0.4.9", default-features = false }
spin = "0.10"
thekernel-linux-process-adapter.workspace = true
strum = { version = "0.28", default-features = false, features = ["derive"] }
syscalls = { version = "0.8", default-features = false }

uluru = "3.1.0"
weak-map = "0.1.1"
xmas-elf = "0.9"
zerocopy = { version = "0.8", features = ["derive"] }

# Kernel targets use the sleepable signal action/registry mutex.
[target.'cfg(target_os = "none")'.dependencies]
thekernel-linux-signal = { workspace = true, features = ["multitask"] }

[target.'cfg(target_arch = "x86_64")'.dependencies]
axcpu = "=0.3.0-preview.8"
x86 = "0.52"
page_table_multiarch = { version = "0.6", features = ["copy-from"] }

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
axcpu = { version = "=0.3.0-preview.8", features = ["host-test-context"] }
