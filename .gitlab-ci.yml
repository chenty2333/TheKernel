stages:
  - quick
  - verify
  - nightly

variables:
  GIT_DEPTH: "0"
  CARGO_TERM_COLOR: "always"
  CARGO_INCREMENTAL: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  THEKERNEL_CI_IMAGE: "ghcr.io/chenty2333/thekernel-dev:latest"

default:
  image:
    name: "$THEKERNEL_CI_IMAGE"
    entrypoint: [""]
  interruptible: true
  before_script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    # Configure these as non-secret project/group variables with exact
    # published 40-hex commits. Missing inputs intentionally fail every gate
    # that would otherwise consume an absent sibling checkout.
    - ./scripts/ci/provision-maintained-siblings.sh
  cache:
    key: "thekernel-${CI_COMMIT_REF_SLUG}"
    paths:
      - target/
      - .state/build-cache/

per-commit:
  stage: quick
  variables:
    CI_DIFF_BASE: "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
  script:
    - ./scripts/ci/per-commit.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - .state/ci/per-commit/

dual-arch-pr:
  stage: verify
  tags:
    - thekernel-qemu
  resource_group: thekernel-qemu
  script:
    - ./scripts/ci/pr-gate.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - .state/ci/pr/
      - kernel-rv
      - kernel-la

nightly-system:
  stage: nightly
  tags:
    - thekernel-qemu
  resource_group: thekernel-qemu
  script:
    - ./scripts/ci/nightly-gate.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - when: never
  # Exit 78 means one or more named test families lack real infrastructure.
  # It intentionally remains a non-passing job so a scheduled pipeline cannot
  # hide a missing nightly capability behind a green status.
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - .state/ci/nightly/
